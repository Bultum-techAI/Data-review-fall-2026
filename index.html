<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bultum Academy — Every Student Data Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F5EF; --paper-2:#FBFAF6; --card:#FFFFFF;
  --ink:#23261F; --muted:#5C6155; --faint:#8A8F82; --line:#E6E2D6;
  --green:#1E5B3E; --green-2:#2E7D52; --green-soft:#E8F0EA; --green-line:#BFD6C6;
  --amber:#C4892B; --amber-soft:#F7EEDB; --amber-line:#E7CF98;
  --red:#BC4A31; --shadow:0 1px 2px rgba(30,40,25,.05),0 6px 20px rgba(30,40,25,.06);
  --shadow-lg:0 8px 30px rgba(30,40,25,.12);
  /* band colors (admin-editable at runtime via JS custom props) */
  --band-red:#C0492F; --band-yellow:#D9A62E; --band-orange:#D9772E; --band-green:#3E8E5A; --band-none:#B8B6AB;
  --r:14px; --r-sm:9px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--paper);
  -webkit-font-smoothing:antialiased;line-height:1.5;font-size:15.5px}
h1,h2,h3,h4{font-family:Fraunces,Georgia,serif;font-weight:600;line-height:1.15;margin:0 0 .4em}
h1{font-size:2.15rem;letter-spacing:-.01em}
h2{font-size:1.6rem}
h3{font-size:1.2rem}
p{margin:0 0 1rem}
a{color:var(--green-2)}
button{font-family:inherit;cursor:pointer}
.serif{font-family:Fraunces,Georgia,serif}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:.85rem}
.center{text-align:center}
.hide{display:none!important}

/* ---------- Layout ---------- */
#app{display:flex;min-height:100vh}
#rail{width:280px;flex:0 0 280px;background:var(--paper-2);border-right:1px solid var(--line);
  padding:22px 18px;position:sticky;top:0;height:100vh;overflow-y:auto}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{position:sticky;top:0;z-index:20;background:rgba(247,245,239,.9);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:12px 30px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
#stage{padding:34px 30px 90px;max-width:1080px;width:100%;margin:0 auto;flex:1}
.wrap-narrow{max-width:760px;margin:0 auto}

.brand{display:flex;align-items:center;gap:11px;margin-bottom:22px}
.brand .mark{width:38px;height:38px;border-radius:10px;background:var(--green);color:#fff;display:grid;place-items:center;
  font-family:Fraunces,serif;font-weight:600;font-size:1.15rem;flex:0 0 auto}
.brand .t{font-family:Fraunces,serif;font-weight:600;font-size:1.02rem;line-height:1.1}
.brand .s{font-size:.72rem;color:var(--faint);letter-spacing:.02em}

/* progress rail */
.rail-h{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:6px 4px 10px;font-weight:600}
.steps{list-style:none;margin:0;padding:0}
.step{display:flex;gap:12px;align-items:flex-start;padding:9px 10px;border-radius:var(--r-sm);cursor:pointer;
  color:var(--muted);position:relative;transition:background .15s}
.step:hover{background:var(--green-soft)}
.step.active{background:var(--green-soft);color:var(--ink)}
.step.active .dot{background:var(--green);border-color:var(--green);color:#fff}
.step.done .dot{background:var(--green-2);border-color:var(--green-2);color:#fff}
.step .dot{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--green-line);flex:0 0 auto;
  display:grid;place-items:center;font-size:.72rem;font-weight:700;background:#fff;color:var(--faint)}
.step .lbl{font-size:.92rem;font-weight:500;padding-top:2px}
.step .num{font-size:.68rem;color:var(--faint);display:block;font-weight:600}
.step.locked{opacity:.5;cursor:not-allowed}
.step-line{width:1.5px;background:var(--line);height:8px;margin-left:21px}

.rail-foot{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.linkbtn{background:none;border:none;color:var(--muted);font-size:.86rem;padding:7px 8px;border-radius:7px;width:100%;text-align:left}
.linkbtn:hover{background:var(--green-soft);color:var(--ink)}

/* topbar bits */
.tb-goal{display:flex;align-items:center;gap:8px;background:var(--green-soft);border:1px solid var(--green-line);
  padding:5px 12px;border-radius:999px;font-size:.82rem;font-weight:600;color:var(--green)}
.tb-goal b{font-family:Fraunces,serif;font-size:1rem}
.tb-goal.amber{background:var(--amber-soft);border-color:var(--amber-line);color:#8a5e12}
.tb-ctx{font-size:.9rem}.tb-ctx b{font-weight:600}
.tb-spacer{flex:1}
.saved{font-size:.8rem;color:var(--green-2);opacity:0;transition:opacity .3s;font-weight:600}
.saved.on{opacity:1}
.tb-btn{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 13px;font-size:.85rem;font-weight:600;color:var(--ink)}
.tb-btn:hover{border-color:var(--green-line);background:var(--green-soft)}

/* ---------- Components ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
.card + .card{margin-top:16px}
.eyebrow{font-size:.8rem;color:var(--green-2);font-weight:600;margin-bottom:6px}
.btn{background:var(--green);color:#fff;border:none;border-radius:10px;padding:12px 22px;font-size:.95rem;font-weight:600;
  box-shadow:var(--shadow)}
.btn:hover{background:#17492f}
.btn.ghost{background:#fff;color:var(--green);border:1.5px solid var(--green-line)}
.btn.ghost:hover{background:var(--green-soft)}
.btn.amber{background:var(--amber)}.btn.amber:hover{background:#a9741f}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:8px 15px;font-size:.85rem;border-radius:8px}
.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:26px}
.actions.between{justify-content:space-between}

textarea,input[type=text],input[type=number],select{width:100%;font-family:inherit;font-size:.95rem;color:var(--ink);
  border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:#fff;resize:vertical}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--green-2);box-shadow:0 0 0 3px var(--green-soft)}
label.fld{display:block;font-weight:600;font-size:.88rem;margin:14px 0 6px}
label.fld .hint{font-weight:400;color:var(--faint);font-size:.82rem}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:.85rem;font-weight:500;color:var(--muted)}
.chip.sel{background:var(--green);color:#fff;border-color:var(--green)}
.chip.amber.sel{background:var(--amber);border-color:var(--amber)}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.g2,.g3,.g4{grid-template-columns:1fr}}

.stat{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.stat .n{font-family:Fraunces,serif;font-size:2.1rem;font-weight:600;line-height:1;color:var(--green)}
.stat .n.amber{color:var(--amber)}.stat .n.red{color:var(--red)}
.stat .l{font-size:.82rem;color:var(--muted);margin-top:6px}

.callout{background:var(--green-soft);border:1px solid var(--green-line);border-radius:var(--r);padding:16px 20px;color:#1c4a34}
.callout.amber{background:var(--amber-soft);border-color:var(--amber-line);color:#7a5511}
.callout .serif{font-size:1.15rem;color:inherit}
.quote{font-family:Fraunces,serif;font-size:1.3rem;line-height:1.35;color:var(--green);font-weight:500}

/* band pill */
.band{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;padding:3px 10px;border-radius:999px;color:#fff}
.band.red{background:var(--band-red)}.band.yellow{background:var(--band-yellow)}
.band.orange{background:var(--band-orange)}.band.green{background:var(--band-green)}.band.none{background:var(--band-none)}

/* student card */
.scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.sc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;box-shadow:var(--shadow);position:relative}
.sc.flag{border-color:var(--amber-line);box-shadow:0 0 0 2px var(--amber-soft)}
.sc h4{font-family:Inter,sans-serif;font-size:1rem;font-weight:600;margin:0 0 2px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sc .gr{font-size:.75rem;color:var(--faint)}
.subj{display:flex;gap:10px;margin-top:10px}
.subj .col{flex:1;background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.subj .col .st{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:600;margin-bottom:4px}
.subj .col .pc{font-family:Fraunces,serif;font-size:1.35rem;font-weight:600;line-height:1}
.subj .col .meta{font-size:.75rem;color:var(--muted);margin-top:3px}
.gwt{font-size:.72rem;font-weight:600;padding:1px 6px;border-radius:5px;display:inline-block;margin-top:5px}
.gwt.up{background:var(--green-soft);color:var(--green)}
.gwt.dn{background:#fbe9e4;color:var(--red)}
.gwt.na{background:#eee;color:var(--faint)}
.sc-more{margin-top:11px;border-top:1px dashed var(--line);padding-top:10px;font-size:.83rem}
.sc-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px}
.tag{font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--green-soft);color:var(--green);border:1px solid var(--green-line)}
.tag.t3{background:#efe4f4;color:#6b3d86;border-color:#d8c2e6}
.tag.math{background:var(--amber-soft);color:#8a5e12;border-color:var(--amber-line)}
.tag.mon{background:#eef1f4;color:#4a5560;border-color:#d5dbe0}
.sc-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.tgl{font-size:.76rem;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:7px;padding:5px 9px}
.tgl:hover{border-color:var(--green-line)}
.tgl.on{background:var(--green);color:#fff;border-color:var(--green)}
.tgl.on.t3{background:#7a4c96;border-color:#7a4c96}
.tgl.on.math{background:var(--amber);border-color:var(--amber)}
.tgl.on.mon{background:#5b6672;border-color:#5b6672}

/* toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar input,.toolbar select{width:auto}
.toolbar .grow{flex:1;min-width:180px}

/* meter */
.meter{display:flex;align-items:center;gap:12px;background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:12px 0}
.meter .bar{flex:1;height:9px;background:#e8e6db;border-radius:99px;overflow:hidden}
.meter .bar>i{display:block;height:100%;background:var(--green-2);border-radius:99px}
.meter.over .bar>i{background:var(--red)}
.meter .lab{font-size:.86rem;font-weight:600;white-space:nowrap}

/* table */
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line)}
th{font-size:.76rem;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);font-weight:600}
tr:hover td{background:var(--paper-2)}

.pill{display:inline-block;font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--paper-2);border:1px solid var(--line);color:var(--muted)}
.pill.ok{background:var(--green-soft);color:var(--green);border-color:var(--green-line)}
.pill.warn{background:var(--amber-soft);color:#8a5511;border-color:var(--amber-line)}

.notice{border-left:3px solid var(--amber);background:var(--amber-soft);padding:11px 15px;border-radius:0 10px 10px 0;font-size:.88rem;color:#7a5511;margin:10px 0}
.notice.green{border-color:var(--green-2);background:var(--green-soft);color:#1c4a34}

.mover{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;background:#fff}
.mover .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

hr.soft{border:none;border-top:1px solid var(--line);margin:22px 0}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,25,18,.4);display:grid;place-items:center;z-index:100;padding:20px}
.modal{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:26px;box-shadow:var(--shadow-lg);max-height:88vh;overflow:auto}

/* mission hero */
.hero{min-height:calc(100vh - 130px);display:flex;flex-direction:column;justify-content:center;max-width:720px;margin:0 auto}
.mission-line{opacity:0;transform:translateY(8px);animation:rise .7s ease forwards}
@keyframes rise{to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.mission-line{animation:none;opacity:1;transform:none}}

.mobile-steps{display:none}
@media(max-width:880px){
  #rail{display:none}
  #app{flex-direction:column}
  .mobile-steps{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--paper-2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:15}
  .ms{flex:0 0 auto;font-size:.76rem;font-weight:600;padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--muted);white-space:nowrap}
  .ms.active{background:var(--green);color:#fff;border-color:var(--green)}
  .ms.done{background:var(--green-soft);color:var(--green);border-color:var(--green-line)}
  #stage{padding:24px 16px 80px}
  #topbar{padding:10px 16px}
}

/* print */
@media print{
  #rail,#topbar,.mobile-steps,.actions,.no-print{display:none!important}
  #stage{padding:0;max-width:none}
  .card{box-shadow:none;border-color:#ccc;break-inside:avoid}
  body{background:#fff}
}
</style>
</head>

</div>

ess themselves", "who": ["2B"]}, {"name": "Ms. Tobe", "group": "SPED", "text": "I will utilize learning through play concepts & incorporate games/activity to keep students engaged and invested in their learning.", "who": ["REV:tobe"]}, {"name": "Ms. Arhely", "group": "6–8", "text": "I will foster and inspire students to become curious about their learning abilities, which encourages them to pursue their own learning interests and build on their academic skills.", "who": []}, {"name": "Kurt Gough", "group": "3–4 reading intervention", "text": "I will implement activities that encourage students to be safe, feel included, and establish routines.", "who": ["REV:kurt"]}, {"name": "Iman S.", "group": "Grade 5", "text": "I will support the students in being inspired to learn by creating an exciting learning environment.", "who": ["5th"]}, {"name": "Agatha", "group": "Kindergarten", "text": "I will empower and build trust in students through supporting and adapting to their needs.", "who": ["KG_A"]}, {"name": "Ms. Hailey & Ms. Annalise", "group": "Grade 4 & interventionist", "text": "Building a connection and using patience while the students grow their skills.", "who": ["4A", "REV:hailey"]}, {"name": "Ms. Sophia / Ms. Yosra", "group": "G2 / G1", "text": "I will be informed in order to inform.", "who": ["2A", "1B"]}, {"name": "Mr. Mohamed", "group": "P.E", "text": "Constant revision of class activities for everyone, and encouraging students to do it.", "who": []}, {"name": "Jake Gibbons", "group": "1st Grade", "text": "Connecting the learning they get at school to what they already know, in order to scaffold their education.", "who": ["1A"]}, {"name": "Jaelynn Persaud", "group": "Pre-K", "text": "I will make space for my students to feel as safe and comfortable as possible to learn.", "who": []}, {"name": "Lucas Vachon", "group": "6, 7, 8", "text": "Encourage youth to find and become their best selves.", "who": ["MS:content"]}, {"name": "Ahmed", "group": "ELL", "text": "Make the class a welcoming place.", "who": ["REV:ell"]}, {"name": "Mr. Ryan", "group": "Multiple", "text": "I will be patient and encourage kids to do their best.", "who": []}, {"name": "Etter", "group": "Grade 3", "text": "I will work diligently to build relationships with ALL students, showing patience through difficult times. Remembering tomorrow is a new day!", "who": ["3A"]}, {"name": "Allison Pieper", "group": "Middle School", "text": "I will provide a comfortable space to ask questions and take risks with ideas.", "who": ["MS:reading"]}], "excellence": [{"name": "Ms. Arhely", "group": "6–8", "text": "Guide students toward a structured learning experience that helps them develop discipline in keeping their studies a high priority, and encourage interest in the material.", "who": []}, {"name": "Kurt Gough", "group": "3–4 reading intervention", "text": "I will implement activities that create challenges for our students, and keep communication with parents about expectations.", "who": ["REV:kurt"]}, {"name": "Agatha", "group": "Kindergarten", "text": "I will advocate for each student's success by empowering a child's individual autonomy in the pursuit of their own learning path.", "who": ["KG_A"]}, {"name": "Ms. Sophia / Ms. Yosra", "group": "G2 / G1", "text": "I will use intentional success and failure to create a safe and encouraging learning environment.", "who": ["2A", "1B"]}, {"name": "Ms. Hailey & Ms. Annalise", "group": "Grade 4 & interventionist", "text": "Help build students' confidence so they feel like they are able to succeed.", "who": ["4A", "REV:hailey"]}, {"name": "Etter", "group": "Grade 3", "text": "I will understand and accommodate each student's academic level, and be prepared with engaging activities and lesson plans!", "who": ["3A"]}, {"name": "Lucas Vachon", "group": "6, 7, 8", "text": "Provide an environment where students feel safe to make mistakes and have confidence to get better.", "who": ["MS:content"]}, {"name": "Jaelynn Persaud", "group": "Pre-K", "text": "I will make sure they speak positive words over themselves, with daily reminders of that every day.", "who": []}, {"name": "Mr. Mohamed", "group": "P.E", "text": "Have a schedule of what is needed from the students and what I will provide as a teacher.", "who": []}, {"name": "Jake Gibbons", "group": "1st Grade", "text": "Pushing them past their comfort zone to challenge themselves and gain a desire for growth.", "who": ["1A"]}, {"name": "Mr. Ryan", "group": "Multiple", "text": "I will encourage kids to try their best no matter how difficult or challenging the activity is.", "who": []}, {"name": "Ahmed", "group": "ELL", "text": "I will inspire students and make them believe they are capable of excelling in academics.", "who": ["REV:ell"]}, {"name": "Allison Pieper", "group": "Middle School", "text": "I will hold students to high standards while providing resources to achieve and challenge.", "who": ["MS:reading"]}], "inclusivity": [{"name": "Ms. Arhely", "group": "6–8", "text": "Encourage students to accept all forms of diversity that can enhance friendships and support a classroom community.", "who": []}, {"name": "Ms. Sophia / Ms. Yosra", "group": "G2 / G1", "text": "I will provide students with consistent care, ample representations of themselves and others, and guided opportunities to have leadership and control.", "who": ["2A", "1B"]}, {"name": "Kurt Gough", "group": "3–4 reading intervention", "text": "I will create student-centered lessons where students work together to build community, learn about each other, and adapt to different needs.", "who": ["REV:kurt"]}, {"name": "Agatha", "group": "Kindergarten", "text": "I will foster an inclusive classroom by embracing my students' individuality, experiences, and curiosity.", "who": ["KG_A"]}, {"name": "Etter", "group": "Grade 3", "text": "I will build a positive classroom environment, gaining insight into each student's individual needs and creating differentiation when needed!", "who": ["3A"]}, {"name": "Ms. Hailey & Ms. Annalise", "group": "Grade 4 & interventionist", "text": "I will create a classroom where students are put in the forefront and engage in hands-on learning.", "who": ["4A", "REV:hailey"]}, {"name": "Jaelynn Persaud", "group": "Pre-K", "text": "I will make this happen by communicating with my students and being a listening ear about their experiences.", "who": []}, {"name": "Mr. Mohamed", "group": "P.E", "text": "Hearing and listening to students and being engaged in their conversations, even non-academic ones.", "who": []}, {"name": "Mr. Ryan", "group": "Multiple", "text": "I will regularly rotate groups and let kids take turns leading their groups.", "who": []}, {"name": "Lucas Vachon", "group": "6, 7, 8", "text": "Create space to listen, understand, ask for clarification, and support one another.", "who": ["MS:content"]}, {"name": "Jake Gibbons", "group": "1st Grade", "text": "Having students turn and talk to each other to get more student perspectives.", "who": ["1A"]}, {"name": "Ahmed", "group": "ELL", "text": "As teachers, we should understand students and their background and take that into account when teaching them.", "who": ["REV:ell"]}, {"name": "Allison Pieper", "group": "Middle School", "text": "I will create opportunities for students to demonstrate their own skills and talents to their peers and community.", "who": ["MS:reading"]}], "thrive": [{"name": "Ms. Arhely", "group": "6–8", "text": "Provide students with the skills to develop their own way of thinking and adapt to the changing environment as they learn.", "who": []}, {"name": "Kurt Gough", "group": "3–4 reading intervention", "text": "Students will work in groups to solve real-world problems.", "who": ["REV:kurt"]}, {"name": "Agatha", "group": "Kindergarten", "text": "I will equip students to thrive beyond the classroom by engaging them in social activities that challenge their schema.", "who": ["KG_A"]}, {"name": "Etter", "group": "Grade 3", "text": "Explicitly teach critical thinking and other skills. Teach students to stay composed and handle their business!", "who": ["3A"]}, {"name": "Jaelynn Persaud", "group": "Pre-K", "text": "I will teach students how to think, not just what to think, and give them the skills to develop their own thinking.", "who": []}, {"name": "Ms. Sophia / Ms. Yosra", "group": "G2 / G1", "text": "I will create instances of safe discomfort or change, to prepare students for larger discomforts and quick adaptations throughout life.", "who": ["2A", "1B"]}, {"name": "Lucas Vachon", "group": "6, 7, 8", "text": "Provide space to get feedback that is useful and meaningful, while advising youth to see what might be trends in the future.", "who": ["MS:content"]}, {"name": "Ms. Hailey & Ms. Annalise", "group": "Grade 4 & interventionist", "text": "I will create a classroom where students engage in learning activities that connect to the real world.", "who": ["4A", "REV:hailey"]}, {"name": "Mr. Ryan", "group": "Multiple", "text": "I will be a mentor to them and lead them in a way that teaches responsibility.", "who": []}, {"name": "Mr. Mohamed", "group": "P.E", "text": "Mentoring students on their decisions in school, and teaching them to try new things and be more flexible.", "who": []}, {"name": "Ahmed", "group": "ELL", "text": "Storytelling is powerful and makes students feel confident; I will also help students learn safety and life skills.", "who": ["REV:ell"]}, {"name": "Allison Pieper", "group": "Middle School", "text": "I will explicitly teach processes of critical thought and communication, then create chances to apply these skills to real-world issues.", "who": ["MS:reading"]}, {"name": "Jake Gibbons", "group": "1st Grade", "text": "Allowing students to explore the latest advances.", "who": ["1A"]}], "personalized": [{"name": "Kurt Gough", "group": "3–4 reading intervention", "text": "I will use my own and my students' experiences to fuel lessons in the classroom.", "who": ["REV:kurt"]}, {"name": "Ms. Arhely", "group": "6–8", "text": "Encourage every student to participate and assess what they are learning; provide feedback to meet their objectives and enhance their learning.", "who": []}, {"name": "Ms. Sophia / Ms. Yosra", "group": "G2 / G1", "text": "I will provide engaging experiences for students to interact with the learning materials, so they are actively involved in their own education.", "who": ["2A", "1B"]}, {"name": "Agatha", "group": "Kindergarten", "text": "I will engage students in learning by incorporating their interests into lessons.", "who": ["KG_A"]}, {"name": "Jaelynn Persaud", "group": "Pre-K", "text": "I will create a safe space for my students and add things that help engage everyone.", "who": []}, {"name": "Etter", "group": "Grade 3", "text": "I will create engaging small groups that give students freedom to make mistakes and learn from them, and I will give students a reason why we are doing something.", "who": ["3A"]}, {"name": "Allison Pieper", "group": "Middle School", "text": "I plan to shift summative assessment to project-based application of skills, allowing students to develop their own ideas within the standards.", "who": ["MS:reading"]}, {"name": "Lucas Vachon", "group": "6, 7, 8", "text": "Relatable stories that challenge students to become adaptive, independent thinkers.", "who": ["MS:content"]}, {"name": "Mr. Ryan", "group": "Multiple", "text": "I will understand their way of thinking and adapt to their needs and struggles.", "who": []}, {"name": "Ms. Hailey & Ms. Annalise", "group": "Grade 4 & interventionist", "text": "I will work to understand the learning styles, preferences, and interests of the students.", "who": ["4A", "REV:hailey"]}, {"name": "Mr. Mohamed", "group": "P.E", "text": "Engaging with students in a way where they can understand concepts in their own ways.", "who": []}, {"name": "Ahmed", "group": "ELL", "text": "Learning should be tailored to students' needs and should be engaging.", "who": ["REV:ell"]}, {"name": "Jake Gibbons", "group": "1st Grade", "text": "Having students come up with ideas for lessons to be taught.", "who": ["1A"]}, {"name": "Ms. Nati", "group": "2nd", "text": "I will give students a chance to say what's working for them and what isn't.", "who": ["2B"]}, {"name": "Ms. Asha", "group": "SPED", "text": "I will provide learning experiences that cater to and embrace my students' individualities.", "who": ["REV:asha"]}, {"name": "Ms. Tobe", "group": "SPED", "text": "I will always center and prioritize the individual learning needs of each student, and prepare experiences that meet them where they are.", "who": ["REV:tobe"]}], "beyond": [{"name": "Kurt Gough", "group": "3–4 reading intervention", "text": "I will implement lessons that use real-world problems and have students apply what they have learned.", "who": ["REV:kurt"]}, {"name": "Ms. Arhely", "group": "6–8", "text": "Everyone has something to contribute to their community and society, so it is important to encourage students to find what drives them to fulfill their vision.", "who": []}, {"name": "Agatha", "group": "Kindergarten", "text": "Beyond my classroom, I will engage students in community-based projects.", "who": ["KG_A"]}, {"name": "Jaelynn Persaud", "group": "Pre-K", "text": "Communication with families is key because they are part of the child. Getting to know your community and their stories gives you a better understanding and outlook.", "who": []}, {"name": "Allison Pieper", "group": "Middle School", "text": "With each class, I plan to set community-involvement goals and dedicate class time to contribute to a long-term goal, plus a biweekly digital newsletter to families.", "who": ["MS:reading"]}, {"name": "Etter", "group": "Grade 3", "text": "Create enjoyable lessons that keep students curious about learning.", "who": ["3A"]}, {"name": "Lucas Vachon", "group": "6, 7, 8", "text": "Constant belief in the positive process of learning and applying knowledge to life.", "who": ["MS:content"]}, {"name": "Mr. Ryan", "group": "Multiple", "text": "Beyond my classroom, I will encourage them to explore life and help them see there is beauty in life.", "who": []}, {"name": "Mr. Mohamed", "group": "P.E", "text": "Teaching them, even outside the classroom, about values — that there is more to life than school, and that their choices prepare them for that.", "who": []}, {"name": "Ms. Hailey & Ms. Annalise", "group": "Grade 4 & interventionist", "text": "Beyond my classroom, I will partner with other teachers, community groups, and families to support our students.", "who": ["4A", "REV:hailey"]}, {"name": "Ahmed", "group": "ELL", "text": "Students should be inspired and empowered in the classroom so they can make a difference in their community.", "who": ["REV:ell"]}, {"name": "Jake Gibbons", "group": "1st Grade", "text": "Students will gain a better sense of community by working together on classroom materials and cleaning.", "who": ["1A"]}], "nurturing": [{"name": "Kurt Gough", "group": "3–4 reading intervention", "text": "I will create lessons that help inspire curiosity and creativity.", "who": ["REV:kurt"]}, {"name": "Agatha", "group": "Kindergarten", "text": "I will inspire curiosity and creativity by modeling patience and respect for one another.", "who": ["KG_A"]}, {"name": "Jaelynn Persaud", "group": "Pre-K", "text": "I will build a comfortable environment for my students to feel inspired to try and push themselves to be their best through encouragement.", "who": []}, {"name": "Ms. Sophia / Ms. Yosra", "group": "G2 / G1", "text": "I will create an honest environment where mistakes become learning moments and kindness creates joy.", "who": ["2A", "1B"]}, {"name": "Allison Pieper", "group": "Middle School", "text": "I will integrate opportunities for students to move throughout the day as part of information processing.", "who": ["MS:reading"]}, {"name": "Ms. Asha", "group": "SPED", "text": "I will focus on their strengths and encourage effort.", "who": ["REV:asha"]}, {"name": "Lucas Vachon", "group": "6, 7, 8", "text": "Create an environment with the freedom to express ideas and learn from our neighbors.", "who": ["MS:content"]}, {"name": "Ms. Tobe", "group": "SPED", "text": "We will create a sensory-friendly environment for each student that is safe, cozy, and conducive to learning.", "who": ["REV:tobe"]}, {"name": "Ahmed", "group": "ELL", "text": "The classroom should nurture students' critical thinking and creativity — work that appeals to their critical and creative minds.", "who": ["REV:ell"]}, {"name": "Ms. Hailey & Ms. Annalise", "group": "Grade 4 & interventionist", "text": "I will create a classroom in which students feel safe to use creativity and make mistakes.", "who": ["4A", "REV:hailey"]}, {"name": "Mr. Ryan", "group": "Multiple", "text": "I will create an environment that is caring and supportive and helps them express themselves.", "who": []}, {"name": "Mr. Mohamed", "group": "P.E", "text": "Showing happiness when students ask questions and have their own ideas; building confidence in expressing ideas.", "who": []}, {"name": "Jake Gibbons", "group": "1st Grade", "text": "Allowing students to explore the world around them and giving them space to ask things as they come to mind.", "who": ["1A"]}], "college-career": [{"name": "Kurt Gough", "group": "3–4 reading intervention", "text": "I will create lessons that prepare students for college success.", "who": ["REV:kurt"]}, {"name": "Agatha", "group": "Kindergarten", "text": "I will push my students to thrive in their life beyond Bultum by giving them a safe space to struggle and build the resilience that life will ask of them.", "who": ["KG_A"]}, {"name": "Ms. Sophia / Ms. Yosra", "group": "G2 / G1", "text": "I will prepare students for the future by ensuring they possess foundational academic, interpersonal, and personal-emotional strategies and skills.", "who": ["2A", "1B"]}, {"name": "Mr. Ryan", "group": "Multiple", "text": "I will teach them async function fbInit(){
  if(!fbEnabled()) return false;

    await loadScript(base+"firebase-app-compat.js");

    fbReady=true; return true;
  }catch(e){ console.warn("Firebase init failed — running locally.",e); return false; }
}
async function fbHydrate(){ // pull cloud state into the local cache before first render
  if(!fbReady) return;
  try{
    const app=await FDB.collection("config").doc("app").get();
    if(app.exists){ LS.set("bdr:config",app.data()); CONFIG=loadConfig(); applyBandColors(); }
    const sec=await FDB.collection("config").doc("sections").get();
    if(sec.exists && sec.data().list) LS.set("bdr:sectionsOverride", sec.data().list);
    const plans=await FDB.collection("plans").get();
    plans.forEach(doc=>{ const i=doc.id.indexOf("__"); if(i<0)return;
      LS.set(planKey(doc.id.slice(0,i), doc.id.slice(i+2)), doc.data()); });
  }catch(e){ console.warn("Firebase hydrate failed",e); }
}
function fbListen(){ // live updates: keep cache fresh + refresh admin view
  if(!fbReady) return;
  FDB.collection("config").doc("app").onSnapshot(d=>{ if(d.exists){ LS.set("bdr:config",d.data()); CONFIG=loadConfig(); applyBandColors(); if(VIEW==="admin")renderAdmin(); }});
  FDB.collection("plans").onSnapshot(snap=>{ let touched=false;
    snap.docChanges().forEach(ch=>{ const id=ch.doc.id, i=id.indexOf("__"); if(i<0)return;
      const sid=id.slice(0,i), role=id.slice(i+2);

      if(SECTION && sid===SECTION.id && role===ROLE) return;

}
function fbDocId(sid,role){ return sid+"__"+(role||"core"); }

const REVIEWERS=[
  {id:"REV_ELL",   name:"Ahmed Ismail",     label:"ELL — Reading (all grades)",         grades:null,                    subjects:["reading"],       who:"REV:ell"},
  {id:"REV_KURT",  name:"Kurt Gough",       label:"Reading Intervention — Grades 4–8",  grades:["4","5","6","7","8"],   subjects:["reading"],       who:"REV:kurt"},
  {id:"REV_HAILEY",name:"Hailey Roemeling", label:"Reading Intervention — Grades K–3",   grades:["K","1","2","3"],       subjects:["reading"],       who:"REV:hailey"},
  {id:"REV_ASHA",  name:"Asha Abdurhaman",  label:"SPED caseload — reading & math",      ids:["552","402","461","624","126","513","409","514","551"], subjects:["reading","math"], who:"REV:asha"},
  {id:"REV_TOBE",  name:"Sahra Tobe",       label:"SPED caseload — reading & math",      ids:["552","402","461","624","126","513","409","514","551"], subjects:["reading","math"], who:"REV:tobe"}
];
function buildReviewers(){
  BULTUM.sections=BULTUM.sections.filter(s=>!s.reviewer); // rebuild fresh each boot
  const src=BULTUM.sections.filter(s=>!s.test&&!s.reviewer);
  REVIEWERS.forEach(rv=>{
    const subs=rv.subjects||[rv.subject], idset=rv.ids?new Set(rv.ids):null, pool=[];
    src.forEach(sec=>{
      if(rv.grades && !rv.grades.includes(sec.grade)) return;
      sec.students.forEach(st=>{
        if(idset){ if(!idset.has(st.id)) return; }
        else if(!subs.some(w=>st[w])) return;
        pool.push(Object.assign({}, st, {_section:sec.className,_grade:sec.grade}));
      });
    });
    const key=subs[0];
    pool.sort((a,b)=>((a[key]||{}).pct??999)-((b[key]||{}).pct??999));
    BULTUM.sections.push({ id:rv.id, className:rv.label, grade:"—", gradeNum:-1, band:null,
      teacher:rv.name, email:"", reviewer:true, scope:Object.assign({subjects:subs},rv), students:pool,
      teachers:[{id:"review", name:rv.name, subjects:subs.map(w=>w[0].toUpperCase()+w.slice(1)).join(" & ")+" · review", subject:key, mode:"review"}] });
  });
}
function subjectsToShow(){ if(SECTION&&SECTION.reviewer) return SECTION.scope.subjects||[SECTION.scope.subject]; return MODE==="review"?["reading","math"] : (SUBJ==="both"?["reading","math"]:[SUBJ]); }
function stepNo(id){ return activeStages().findIndex(s=>s.id===id)+1; }
function sp(sid){ // per-student plan record within current section
  if(!PLAN.students[sid]) PLAN.students[sid]={readingTier:"none",readingAlt:false,mathTier:"none",mathAlt:false,monitor:false,reasons:{},evidence:{}};
  return PLAN.students[sid];
}
let saveTimer=null;
function save(){ if(!PLAN||!SECTION) return; PLAN.updated=Date.now();
  LS.set(planKey(SECTION.id,ROLE),PLAN); flashSaved(); fbPushPlan(SECTION.id,ROLE,PLAN); }

/* ---------------- helpers ---------------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function median(a){ if(!a.length)return null; const s=[...a].sort((x,y)=>x-y),m=Math.floor(s.length/2);
  return s.length%2?s[m]:Math.round((s[m-1]+s[m])/2); }
function fullName(s){ return `${s.first} ${s.last}`.trim(); }
function shortName(s){ return `${s.first} ${s.last?s.last[0]+".":""}`.trim(); }
function bandOf(pct){ if(pct==null) return {key:"none",label:"No score"};
  const b=CONFIG.bands.find(b=>pct>=b.min&&pct<=b.max); return b||{key:"none",label:"—"}; }
function subj(s,which){ return s[which]||null; }
function gradeLabel(g){ return g==="K"?"K":"Grade "+g; }

function sectionStats(sec,which){
  const rows=sec.students.map(s=>s[which]).filter(Boolean);
  const pcts=rows.map(r=>r.pct).filter(v=>v!=null);
  const grow=rows.map(r=>r.growth).filter(v=>v!=null);
  const dist={red:0,yellow:0,orange:0,green:0,none:0};
  sec.students.forEach(s=>{ const r=s[which]; dist[ r? bandOf(r.pct).key : "none" ]++; });
  return {
    n:rows.length, medianPct:median(pcts), medianGrowth:median(grow),
    belowGoal:pcts.filter(v=>v<CONFIG.goals.achievement).length,
    atGoal:pcts.filter(v=>v>=CONFIG.goals.achievement).length,
    metGrowth:grow.filter(v=>v>=CONFIG.goals.growth).length, growthN:grow.length,
    dist
  };
}
function needScore(s){ // higher = more need (lower achievement, lower growth)
  const parts=[];
  ["reading","math"].forEach(w=>{ const r=s[w]; if(r&&r.pct!=null) parts.push(r.pct); });
  if(!parts.length) return -1;
  const ach=Math.min(...parts);
  let g=100; ["reading","math"].forEach(w=>{ const r=s[w]; if(r&&r.growth!=null) g=Math.min(g,r.growth); });
  return (100-ach) + (g<CONFIG.goals.growth ? (CONFIG.goals.growth-g)*0.25 : 0);
}
function isStale(s,which){ const r=s[which]; return !!(r&&r.stale); }
function realSections(){ return BULTUM.sections.filter(s=>!s.test&&!s.reviewer); } // excludes Test Class + specialist reviewers from schoolwide rollups
function staleCount(sec,which){ return sec.students.filter(s=>isStale(s,which)).length; }
function staleNames(sec,which){ return sec.students.filter(s=>isStale(s,which)).map(shortName); }

/* counts for capacity meters (current section) */
function counts(){
  let rc=0,rcA=0,gr=0,mc=0,mcA=0,mon=0;
  Object.values(PLAN.students).forEach(p=>{
    if(p.readingTier==="t2"){ p.readingAlt?rcA++:rc++; }
    if(p.readingTier==="t3") gr++;
    if(p.mathTier==="t2"){ p.mathAlt?mcA++:mc++; }
    if(p.monitor) mon++;
  });
  return {rc,rcA,gr,mc,mcA,mon};
}
function mathTarget(sec){ return sec.band==="K3"?CONFIG.planTargets.k3Math:CONFIG.planTargets.g48Math; }

function furthest(){ // furthest stage index reached (for gating), always allow visited
  const idx=STAGES.findIndex(s=>s.id===CUR);
  const doneMax=PLAN?Math.max(-1,...PLAN.done.map(id=>STAGES.findIndex(s=>s.id===id))):-1;
  return Math.max(idx,doneMax);
}

/* navigation */
function go(id){ CUR=id; markVisited(id); VIEW="journey"; renderRail(); renderTopbar(); renderStage(); window.scrollTo(0,0); }
function markVisited(id){ if(PLAN&&!PLAN.done.includes(id)){ /* visited != done; done set on Continue */ } }
function complete(id){ if(PLAN&&!PLAN.done.includes(id)){ PLAN.done.push(id); save(); } }
function next(){ const stg=activeStages(); const i=stg.findIndex(s=>s.id===CUR); complete(CUR); if(i<stg.length-1) go(stg[i+1].id); else go(stg[stg.length-1].id); }
function prev(){ const stg=activeStages(); const i=stg.findIndex(s=>s.id===CUR); if(i>0) go(stg[i-1].id); }
function navBtns(nextLabel){
  return `<div class="actions between no-print">
    <button class="btn ghost" onclick="prev()">← Back</button>
    <button class="btn" onclick="next()">${esc(nextLabel||"Continue")}</button></div>`;
}

/* --- Stage 1: Mission --- */
function missionContribFor(pid){
  const base=((BULTUM.meta.missionContrib||{})[pid]||[]).map(c=>({name:c.name,group:c.group,text:c.text}));
  const seen=new Set(base.map(b=>b.text.trim().toLowerCase()));
  (MISSION_LIVE.sentences[pid]||[]).forEach(s=>{const k=(s.sentence||"").trim().toLowerCase(); if(k&&!seen.has(k)){seen.add(k);base.push({name:s.name,group:s.group,text:s.sentence});}});
  return base;
}
function activeMissionKey(){ if(!SECTION) return null; if(SECTION.reviewer) return SECTION.scope.who; return SECTION.gradeNum>=6 ? "MS:"+ROLE : SECTION.id; }
function myMissionStatements(){
  const key=activeMissionKey(); if(!key) return [];
  const growth=["excellence","thrive","college-career"];
  const kw=/(growth|success|excel|achiev|thrive|potential|challeng|high standard|resilience|grade level|confiden|succeed)/i;
  const out=[];
  MISSION_PHRASES.forEach(p=>((BULTUM.meta.missionContrib||{})[p.id]||[]).forEach(c=>{
    if((c.who||[]).includes(key)) out.push({phrase:p.phrase,accent:p.accent,text:c.text,
      score:(growth.includes(p.id)?2:0)+(kw.test(c.text)?1:0)}); }));
  out.sort((a,b)=>b.score-a.score);
  return out;
}
function myMissionCard(){
  const mine=myMissionStatements(); if(!mine.length) return "";

}

/* --- Stage 2: Know Your Class --- */
function subjSnapshot(sec,which,label){
  const s=sectionStats(sec,which);
  if(!s.n) return `<div class="card"><h3>${label}</h3><p class="muted">No ${label.toLowerCase()} scores available for this class.</p></div>`;
  const g=CONFIG.goals;
  const distBars=CONFIG.bands.map(b=>{
    const c=s.dist[b.key]||0, pct=Math.round(c/s.n*100);
    return `<div style="flex:${c||0.001} 0 0;min-width:${c?'34px':'0'}" title="${b.label}: ${c}">
      ${c?`<div style="height:34px;background:${b.color};border-radius:6px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.8rem">${c}</div>
      <div class="small center" style="margin-top:3px;color:${b.color};font-weight:600">${b.label}</div>`:""}</div>`;
  }).join("");
  const growTxt = s.medianGrowth==null
    ? `<span class="faint">Growth compares this fall to last fall; new students don’t have a growth score yet.</span>`
    : `Median growth <b>${s.medianGrowth}th</b> percentile · ${s.metGrowth} of ${s.growthN} met the ${g.growth}th-percentile goal`;
  const belowClass = s.medianPct<g.achievement?"amber":"green";
  const stale=staleCount(sec,which);
  const staleNote = stale ? `<div class="notice" style="margin-top:10px;background:#FBEFD6;border-color:#e8c97a;color:#6b4a00">
      <b>${stale} student${stale>1?"s":""}</b> ${stale>1?"are":"is"} shown with <b>last year’s score (Fall 2025)</b> — no Fall 2026 test yet.
      Their percentiles here are prior-year and have no growth. Treat them as a prompt to check in, not a current measure.</div>` : "";
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px">
      <h3 style="margin:0">${label}</h3><span class="pill">${s.n} students</span></div>
    <div class="grid g3" style="margin:14px 0">
      <div class="stat"><div class="n ${s.medianPct<g.achievement?'amber':''}">${s.medianPct??"—"}<span style="font-size:1rem">th</span></div>
        <div class="l">Median achievement percentile<br><span class="faint">School goal: ${g.achievement}th</span></div></div>
      <div class="stat"><div class="n ${s.belowGoal? 'red':''}">${s.belowGoal}</div>
        <div class="l">Below the ${g.achievement}th-percentile target</div></div>
      <div class="stat"><div class="n">${s.atGoal}</div><div class="l">At or above target</div></div>
    </div>
    <div class="small muted" style="margin-bottom:6px;font-weight:600">Where students land now</div>
    <div style="display:flex;gap:6px;align-items:flex-end">${distBars}</div>
    <div class="notice ${belowClass==='green'?'green':''}" style="margin-top:16px">${growTxt}</div>
    ${staleNote}
  </div>`;
}
function iaFor(grade,subject){ const g=(BULTUM.meta.instructionalAreas||{})[grade]; return g&&g[subject]?g[subject]:null; }
function iaBar(pcts){ const B=BULTUM.meta.iaBands;
  return `<div style="display:flex;height:15px;border-radius:5px;overflow:hidden;border:1px solid var(--line)">${
    pcts.map((p,i)=>p>0?`<div title="${B[i].label} (${B[i].pct}th): ${p}%" style="width:${p}%;background:${B[i].color}"></div>`:"").join("")}</div>`; }
function iaSubjectPanel(grade,subject){
  const info=iaFor(grade,subject); if(!info) return "";
  const areas=info.areas.map(a=>({...a,focus:a.pcts[0]+a.pcts[1],strong:a.pcts[3]+a.pcts[4]})).sort((x,y)=>y.focus-x.focus);
  const topFocus=areas[0], topStrong=[...areas].sort((x,y)=>y.strong-x.strong)[0];
  const rows=areas.map(a=>`<div style="margin:10px 0">
      <div style="display:flex;justify-content:space-between;font-size:.9rem;gap:8px"><b>${esc(a.area)}</b>
        <span class="faint small" style="white-space:nowrap">${a.strong}% at/above · ${a.focus}% below</span></div>
      ${iaBar(a.pcts)}</div>`).join("");
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px">
      <h3 style="margin:0">${esc(subject)} — topic strengths &amp; focus</h3>
      <span class="pill">Grade ${esc(grade)} · ${info.n||"—"} students</span></div>
    <p class="muted small" style="margin:6px 0 2px">Where the <b>whole grade</b> lands on each topic this fall — grade-level, not just this class.

function drawReview(){
  const subs=SECTION.scope.subjects||[SECTION.scope.subject], f=reviewFilter;

  if(f.band!=="all") list=list.filter(s=>subs.some(w=>s[w]&&bandOf(s[w].pct).key===f.band));
  if(f.flagOnly) list=list.filter(s=>subs.some(w=>s[w]&&(bandOf(s[w].pct).key===CONFIG.bands[0].key||s[w].pct<CONFIG.goals.achievement)));
  const anyFb=list.some(s=>s.fastbridge&&s.fastbridge.risk);

    return `<td>${rr.pct??"—"}th ${rr.stale?'<span class="faint" style="color:#8a5a00">✷</span>':''} <span class="band ${b.key}" style="font-size:.7rem">${b.label}</span></td>`;};
  const fbCell=s=>{ if(!anyFb) return ""; const r=s.fastbridge&&s.fastbridge.risk;

    <tbody>${rows||`<tr><td colspan="${2+subs.length+(anyFb?1:0)}" class="muted">No students match.</td></tr>`}</tbody></table></div>
    <div class="faint small" style="margin-top:6px">${list.length} shown. ✷ = last year's score.</div>`;

function drawCards(){
  let list=[...SECTION.students];

  if(f.q) list=list.filter(s=>fullName(s).toLowerCase().includes(f.q));
  if(f.band!=="all") list=list.filter(s=>{
    const checkW=f.which==="all"?["reading","math"]:[f.which];
    return checkW.some(w=>s[w]&&bandOf(s[w].pct).key===f.band);
  });
  if(f.flagOnly){ const th=SECTION.students.map(needScore).sort((a,b)=>b-a); const cut=th[Math.min(4,th.length-1)];
    list=list.filter(s=>needScore(s)>=Math.max(cut,0.0001)&&needScore(s)>=0); }
  const sorters={ need:(a,b)=>needScore(b)-needScore(a), name:(a,b)=>fullName(a).localeCompare(fullName(b)),
    ach:(a,b)=>(minPct(a)-minPct(b)), growth:(a,b)=>(minGrow(a)-minGrow(b)) };
  list.sort(sorters[f.sort]||sorters.need);
  $("#scards").innerHTML = list.length? list.map(studentCard).join("")
    : `<div class="card"><p class="muted" style="margin:0">No students match these filters.</p></div>`;

function minPct(s){ const v=["reading","math"].map(w=>s[w]&&s[w].pct).filter(x=>x!=null); return v.length?Math.min(...v):999; }
function minGrow(s){ const v=["reading","math"].map(w=>s[w]&&s[w].growth).filter(x=>x!=null); return v.length?Math.min(...v):999; }
function subjBlock(s,which,label){

  return `<div class="col"><div class="st">${label}${r.stale?` <span style="font-size:.6rem;color:#8a5a00;font-weight:700" title="Prior-year score">✷</span>`:""}</div>

    <div>${gw}</div></div>`;
}
function studentCard(s){

function fbChip(risk){

}

        <p class="small muted"><b>Reading Corps</b> (${esc(CONFIG.frequency.reading)}) and <b>Math Corps</b> provide targeted
          support to students who need more than core instruction alone.</p></div>
      <div class="card"><span class="pill warn">Tier 3 · Few</span><h3 style="margin-top:10px">Intensive intervention</h3>
        <p class="small muted"><b>Groves</b> (${esc(CONFIG.frequency.groves)}) is our most intensive reading support, for the
          students who are furthest behind and need more frequent, intensive help.</p></div>
    </div>
    <div class="notice" style="margin-top:16px">There is currently Tier 2 math support (Math Corps) but
      <b>no separate Tier 3 math program</b> — so Tier 1 math instruction and thoughtful use of the limited Math Corps
      spaces matter even more.</div>
    <div class="card" style="margin-top:16px">
      <label class="fld" style="margin-top:0">Before we assume intervention is the answer — what can you
        strengthen in your <b>Tier 1</b> instruction first?</label>
      <textarea rows="3" id="s_tier1" placeholder="In core instruction I can strengthen…">${esc(r.tier1||"")}</textarea>
    </div>
    ${navBtns("Plan reading support →")}`;
  bindText("s_tier1","tier1");
}

/* --- Stage 5 & 6: intervention planning (reading / math) --- */
function planStudentRow(s,mode){
  const p=sp(s.id); const r=s.reading, m=s.math;
  const show = mode==="reading"?r:m;
  const b = show?bandOf(show.pct):null;
  let controls="";
  if(mode==="reading"){
    const k3 = SECTION && SECTION.gradeNum>=0 && SECTION.gradeNum<=3;
    const grovesTierLabel = k3 ? "T3" : "T2";
    controls=`
      <button class="tgl ${p.readingTier==='none'?'on':''}" data-r="none" data-sid="${s.id}">Tier 1 only</button>
      ${k3?`<button class="tgl ${p.readingTier==='t2'?'on':''}" data-r="t2" data-sid="${s.id}">Reading Corps (T2)</button>`:""}
      <button class="tgl t3 ${p.readingTier==='t3'?'on':''}" data-r="t3" data-sid="${s.id}">Groves (${grovesTierLabel})</button>
      ${(k3&&p.readingTier==='t2')?`<button class="tgl ${p.readingAlt?'on':''}" data-ralt="${s.id}">Alternate</button>`:""}`;
  }else{
    controls=`
      <button class="tgl ${p.mathTier==='none'?'on':''}" data-m="none" data-sid="${s.id}">Tier 1 only</button>
      <button class="tgl math ${p.mathTier==='t2'?'on':''}" data-m="t2" data-sid="${s.id}">Math Corps (T2)</button>
      ${p.mathTier==='t2'?`<button class="tgl ${p.mathAlt?'on':''}" data-malt="${s.id}">Alternate</button>`:""}`;
  }
  const growth = show? (show.growth==null?"new":show.growth+"th") : "—";
  const nudge=planNudge(s,mode);
  return `<div class="mover" data-sid="${s.id}">
    <div class="hd"><div><b>${esc(shortName(s))}</b> <span class="faint small">· ${esc(gradeLabel(s.grade))}</span>
      ${show?`<span class="band ${b.key}" style="margin-left:6px">${b.label}</span>`:""}</div>
      <div class="small muted">${show?`${show.pct??"—"}th pct · RIT ${show.rit} · growth ${growth}`:"no score"}</div></div>
    <div class="sc-btns">${controls}</div>
    ${nudge?`<div class="notice" style="margin:9px 0 0">${nudge}</div>`:""}
    ${( (mode==='reading'&&p.readingTier==='t3') )?grovesEvidence(s):""}
    ${( (mode==='reading'&&p.readingTier!=='none')||(mode==='math'&&p.mathTier!=='none') )?
      `<input type="text" class="reasonbox" data-reason="${s.id}" data-mode="${mode}" placeholder="Why this support? (brief)" value="${esc((p.reasons&&p.reasons[mode])||'')}" style="margin-top:9px">`:""}
  </div>`;
}
function planNudge(s,mode){
  const r=s[mode]; if(!r||r.pct==null) return "";
  const p=sp(s.id); const lowBand=CONFIG.bands[0].max; const g=CONFIG.goals.growth;
  if(mode==="reading"){
    const k3 = SECTION && SECTION.gradeNum>=0 && SECTION.gradeNum<=3;
    if(r.pct<=lowBand && p.readingTier==="none")
      return k3 ? `This is among your highest-need readers. Would you like to consider Reading Corps (Tier 2) or Groves (Tier 3)?`
                : `This is among your highest-need readers. Would you like to consider Groves (Tier 2 reading support)?`;
  }else{
    if(r.pct<=lowBand && p.mathTier==="none")
      return `One of your highest-need math students on the data. Consider whether a Math Corps review is warranted.`;
  }
  if(r.growth!=null && r.pct<CONFIG.goals.achievement && r.growth>=g)
    return `Below the achievement target but growing strongly (${r.growth}th). Consider what’s already working before changing the plan.`;
  if(r.growth!=null && r.pct>=CONFIG.goals.achievement && r.growth<g)
    return `Achievement looks solid, but growth is below goal (${r.growth}th). Is this student getting enough challenge?`;
  return "";
}
function grovesEvidence(s){
  const p=sp(s.id); const ev=p.evidence||{};
  const k3 = SECTION && SECTION.gradeNum>=0 && SECTION.gradeNum<=3;
  const q = k3
    ? "What evidence tells you this student needs intensive Tier 3 (Groves) support?"
    : "What evidence tells you this student needs targeted Tier 2 reading (Groves) support?";
  const items = k3
    ? [["gap","Large skill gap"],["history","Tier 2 hasn’t been enough"],["class","Classroom reading confirms need"],["other2","Other assessment agrees"]]
    : [["gap","Large skill gap"],["history","Tier 1 hasn’t been enough"],["class","Classroom reading confirms need"],["other2","Other assessment agrees"]];
  return `<div class="card" style="margin:9px 0 0;padding:13px 15px;background:var(--paper-2)">
    <div class="small" style="font-weight:600;margin-bottom:6px">${q}</div>
    <div class="chips">${items.map(([k,l])=>`<button class="chip ${ev[k]?'sel':''}" data-ev="${k}" data-sid="${s.id}">${l}</button>`).join("")}</div>
    <input type="text" data-evnote="${s.id}" placeholder="Note (optional)" value="${esc(ev.note||'')}" style="margin-top:4px">
  </div>`;
}
function bindPlanControls(root,mode){
  root.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const p=sp(b.dataset.sid);p.readingTier=b.dataset.r;if(p.readingTier!=='t2')p.readingAlt=false;save();redrawPlan(mode);});
  root.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{const p=sp(b.dataset.sid);p.mathTier=b.dataset.m;if(p.mathTier!=='t2')p.mathAlt=false;save();redrawPlan(mode);});
  root.querySelectorAll("[data-ralt]").forEach(b=>b.onclick=()=>{const p=sp(b.dataset.ralt);p.readingAlt=!p.readingAlt;save();redrawPlan(mode);});
  root.querySelectorAll("[data-malt]").forEach(b=>b.onclick=()=>{const p=sp(b.dataset.malt);p.mathAlt=!p.mathAlt;save();redrawPlan(mode);});
  root.querySelectorAll("[data-ev]").forEach(b=>b.onclick=()=>{const p=sp(b.dataset.sid);p.evidence=p.evidence||{};p.evidence[b.dataset.ev]=!p.evidence[b.dataset.ev];save();b.classList.toggle("sel");});
  root.querySelectorAll("[data-evnote]").forEach(i=>i.oninput=()=>{const p=sp(i.dataset.evnote);p.evidence=p.evidence||{};p.evidence.note=i.value;save();});
  root.querySelectorAll("[data-reason]").forEach(i=>i.oninput=()=>{const p=sp(i.dataset.reason);p.reasons=p.reasons||{};p.reasons[i.dataset.mode]=i.value;save();});
}
function redrawPlan(mode){ (mode==="reading"?stReading:stMath)($("#stage")); }

function readingMeter(){
  const c=counts(), t=CONFIG.planTargets.reading;
  const k3 = SECTION && SECTION.gradeNum>=0 && SECTION.gradeNum<=3;
  const over=c.rc>t;
  const perGrade=CONFIG.capacities.grovesK3PerGrade||4;
  const perClass48=CONFIG.capacities.grovesG48PerClass||4;
  const grovesCap = k3 ? perGrade : perClass48;
  const grovesNote = k3 ? `${c.gr} recommended · ~${perGrade} per grade (shared with the other ${SECTION.grade} class)`
    : `${c.gr} recommended · ${perClass48} spots for this class`;
  const rcMeter = k3 ? `<div class="meter ${over?'over':''}">
      <div class="lab">Reading Corps (Tier 2)</div>
      <div class="bar"><i style="width:${Math.min(100,c.rc/Math.max(t,1)*100)}%"></i></div>
      <div class="lab">${c.rc} of ~${t} priority${c.rcA?` · ${c.rcA} alt`:""}</div></div>` : "";
  return `${rcMeter}
    <div class="meter">
      <div class="lab">Groves (${k3?"Tier 3":"Tier 2"})</div>
      <div class="bar"><i style="width:${grovesCap?Math.min(100,c.gr/grovesCap*100):0}%"></i></div>
      <div class="lab">${grovesNote}</div></div>
    <div class="faint small" style="margin-top:6px">Capacities are current and can flex a little with scheduling — a guide, not a hard cutoff.</div>`;
}
function stReading(el){
  const k3 = SECTION && SECTION.gradeNum>=0 && SECTION.gradeNum<=3;
  const list=[...SECTION.students].filter(s=>s.reading).sort((a,b)=>(a.reading.pct??999)-(b.reading.pct??999));
  el.innerHTML=`
    <div class="eyebrow">Step ${stepNo('reading')} · Plan reading support</div>
    <h1>Reading — targeted &amp; intensive support</h1>
    <div class="notice" style="margin-bottom:12px">${k3
      ? `<b>K–3 reading support:</b> <b>Reading Corps</b> is Tier 2, and <b>Groves</b> is Tier 3 (our most intensive).`
      : `<b>Grades 4–8 reading support:</b> <b>Groves</b> is the Tier 2 program. Reading Corps is K–3 only, and there is <b>no Tier 3 reading program</b> for 4–8 at this time — so also plan strong Tier 1 instruction and progress monitoring.`}</div>
    <p class="muted wrap-narrow" style="margin-left:0;display:${k3?'block':'none'}"><b>Reading Corps</b> is Tier 2 (${esc(CONFIG.frequency.reading)}); planning target is
      about <b>${CONFIG.planTargets.reading} priority students</b> per class. <b>Groves</b> is Tier 3 (${esc(CONFIG.frequency.groves)}) for the
      students furthest behind. These are <b>recommendations for review</b>, not placements.</p>
    ${readingMeter()}
    <div class="notice green">Sorted lowest achievement first. Don’t let one percentile decide — weigh skill gaps,
      classroom reading, growth, and whether earlier support has been enough.</div>
    <div id="planlist">${list.map(s=>planStudentRow(s,"reading")).join("")}</div>
    ${navBtns("Plan math support →")}`;
  bindPlanControls($("#planlist"),"reading");
}
function mathMeter(){
  const c=counts(), t=mathTarget(SECTION), band=SECTION.band==="K3"?"K–3":"4–8";
  const over=c.mc>t+1;
  return `<div class="meter ${over?'over':''}">
      <div class="lab">Math Corps (Tier 2 · ${band})</div>
      <div class="bar"><i style="width:${Math.min(100,c.mc/Math.max(t,1)*100)}%"></i></div>
      <div class="lab">${c.mc} of ~${t} priority${c.mcA?` · ${c.mcA} alt`:""}</div></div>`;
}
function stMath(el){
  const list=[...SECTION.students].filter(s=>s.math).sort((a,b)=>(a.math.pct??999)-(b.math.pct??999));
  const band=SECTION.band==="K3"?"K–3":"4–8", t=mathTarget(SECTION);
  el.innerHTML=`
    <div class="eyebrow">Step ${stepNo('math')} · Plan math support</div>
    <h1>Math — Math Corps review</h1>
    <p class="muted wrap-narrow" style="margin-left:0">Math Corps is Tier 2. For ${band}, the planning target is about
      <b>${t} students</b> per class. Mark your priority candidates; use <b>Alternate</b> for additional need beyond the target.
      Math Corps makes the final eligibility decision — these are <b>recommendations for review</b>.</p>
    ${mathMeter()}
    <div class="notice">There is no Tier 3 math program, so also think about who you’ll watch closely in Tier 1 math.</div>
    <div id="planlist">${list.map(s=>planStudentRow(s,"math")).join("")}</div>
    ${navBtns("Set your class goals →")}`;
  bindPlanControls($("#planlist"),"math");
}

/* --- Stage 7: Class goals (SMART) --- */
function goalBlock(which,label){
  const st=sectionStats(SECTION,which); const g=PLAN.goals[which]||{}; const goal=CONFIG.goals;
  const base=st.medianPct; 
  const smart = base==null?"" :
    `By <b>Winter</b>, our class ${label} median achievement percentile will move from <b>${base}</b> toward
     <b>${g.winterPct||"__"}</b>, with <b>${g.winterMet||"__"}</b> of ${st.n} students demonstrating progress toward their growth targets.
     By <b>Spring</b>, our median will reach at least <b>${g.springPct||goal.achievement}</b>, with class growth at or above the
     <b>${goal.growth}th</b> percentile.`;
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap">
      <h3 style="margin:0">${label}</h3>
      <span class="pill ${base!=null&&base<goal.achievement?'warn':'ok'}">Fall baseline: ${base??"—"}th</span></div>
    <div class="grid g3" style="margin:14px 0">
      <div><label class="fld" style="margin-top:0">Winter target percentile</label>
        <input type="number" min="1" max="99" data-goal="${which}.winterPct" value="${g.winterPct||""}" placeholder="${base!=null?Math.min(goal.achievement,base+7):""}"></div>
      <div><label class="fld" style="margin-top:0">Spring target percentile</label>
        <input type="number" min="1" max="99" data-goal="${which}.springPct" value="${g.springPct||""}" placeholder="${goal.achievement}"></div>
      <div><label class="fld" style="margin-top:0"># students meeting target by Winter</label>
        <input type="number" min="0" max="${st.n}" data-goal="${which}.winterMet" value="${g.winterMet||""}" placeholder="of ${st.n}"></div>
    </div>
    ${base!=null?`<div class="callout"><div class="small" style="font-weight:600;margin-bottom:4px">Your SMART goal</div>${smart}</div>`:`<p class="muted">No ${label.toLowerCase()} baseline available.</p>`}
    <label class="fld">What will you do instructionally to make this possible? <span class="hint">2–4 specific actions.</span></label>
    <textarea rows="3" data-goal="${which}.actions" placeholder="1) …&#10;2) …">${esc(g.actions||"")}</textarea>
  </div>`;
}
function stGoals(el){

    const g=PLAN.goals.content||{};
    el.innerHTML=`
    <div class="eyebrow">Step ${stepNo('goals')} · Set your goals</div>

    <p class="muted wrap-narrow" style="margin-left:0">There’s no NWEA percentile to target in these subjects, so your goals

      <label class="fld">How will you support your struggling readers and mathematicians in your content? <span class="hint">2–4 specific actions.</span></label>
      <textarea rows="3" data-cgoal="actions" placeholder="1) …&#10;2) …">${esc(g.actions||"")}</textarea>
      <label class="fld">How will you know it’s working? <span class="hint">Evidence you’ll watch — you decide what counts.</span></label>
      <textarea rows="2" data-cgoal="evidence" placeholder="I’ll know because…">${esc(g.evidence||"")}</textarea>

    <div class="eyebrow">Step ${stepNo('goals')} · Set class goals</div>
    <h1>Where is this class going?</h1>
    <p class="muted wrap-narrow" style="margin-left:0">School goals are the <b>${CONFIG.goals.achievement}th</b> percentile for achievement and the
      <b>${CONFIG.goals.growth}th</b> for growth. Set an ambitious but honest trajectory from your Fall baseline — don’t force
      ${CONFIG.goals.achievement} by Winter if the starting point makes that unrealistic.</p>
    <div class="${subjectsToShow().length>1?'grid g2':''}" style="margin-top:16px">${subjectsToShow().map(w=>goalBlock(w,w==="reading"?"Reading":"Math")).join("")}</div>
    ${navBtns("Name the students →")}`;
  el.querySelectorAll("[data-goal]").forEach(inp=>inp.oninput=()=>{
    const [w,k]=inp.dataset.goal.split("."); PLAN.goals[w]=PLAN.goals[w]||{}; PLAN.goals[w][k]=inp.value; save();
  });
}

/* --- Stage 8: Name the students (movers + watch list) --- */
function stMovers(el){
  const moverSubj = (SUBJ==="math"||SUBJ==="reading")?SUBJ:null; // null = use best available
  const byBand={}; CONFIG.bands.forEach(b=>byBand[b.key]=[]);
  SECTION.students.forEach(s=>{ const r=moverSubj?s[moverSubj]:(s.reading||s.math); if(r){ byBand[bandOf(r.pct).key].push(s); } });
  const bandCols=CONFIG.bands.map(b=>{
    const studs=byBand[b.key]||[];
    if(!studs.length) return "";
    return `<div style="margin-bottom:14px"><span class="band ${b.key}">${b.label}</span>
      <div class="chips" style="margin-top:8px">${studs.map(s=>{
        const on=PLAN.movers.some(m=>m.sid===s.id);
        return `<button class="chip ${on?'sel':''}" data-mover="${s.id}">${esc(shortName(s))}</button>`;
      }).join("")}</div></div>`;
  }).join("");
  const watchItems=[
    "A quiet student who’s below target","Average achievement but poor growth","Strong growth but still far behind",
    "Performs differently in class than on NWEA","Attendance may be affecting progress","Growth has stalled — needs enrichment",
    "Hasn’t responded to previous support"];
  el.innerHTML=`
    <div class="eyebrow">Step ${stepNo('movers')} · Name the students</div>
    <h1>Which students must move for your class to move?</h1>
    <p class="muted">Name real children. Tap the students you are personally committing to move this year, then set each one a goal.</p>
    <div class="card">${bandCols||'<p class="muted" style="margin:0">No banded students to show.</p>'}</div>
    <div id="moverPlans" style="margin-top:16px"></div>
    <hr class="soft">
    <h2>Who are we at risk of overlooking?</h2>
    <p class="muted">The students easiest to miss are often the ones a percentile doesn’t flag.</p>
    <div class="card">
      <div class="chips">${watchItems.map((w,i)=>`<button class="chip ${PLAN.watch.some(x=>x.reason===w)?'sel':''}" data-watch="${i}">${esc(w)}</button>`).join("")}</div>
      <label class="fld">Anyone you want to add to your <b>Monitor Closely</b> list? <span class="hint">Name + why.</span></label>
      <textarea rows="2" id="watchNote" placeholder="e.g., Amina — quiet, average scores, but growth stalled">${esc(PLAN.reflections.watchNote||"")}</textarea>
    </div>
    ${navBtns("Build my plan →")}`;
  el.querySelectorAll("[data-mover]").forEach(b=>b.onclick=()=>toggleMover(b.dataset.mover));
  el.querySelectorAll("[data-watch]").forEach(b=>b.onclick=()=>{
    const w=watchItems[b.dataset.watch]; const i=PLAN.watch.findIndex(x=>x.reason===w);
    if(i>=0)PLAN.watch.splice(i,1); else PLAN.watch.push({reason:w}); save(); b.classList.toggle("sel");
  });
  bindText("watchNote","watchNote");
  drawMoverPlans();
}
function toggleMover(sid){
  const i=PLAN.movers.findIndex(m=>m.sid===sid);
  const defSubj=(SUBJ==="math"||SUBJ==="reading")?SUBJ:"reading";
  if(i>=0)PLAN.movers.splice(i,1); else PLAN.movers.push({sid,subject:defSubj,winterBand:"",springBand:"",winterPct:"",springPct:"",plan:[],notes:""});
  save(); stMovers($("#stage"));
}
const MOVER_ACTIONS=["Tier 1 small group","Individual conference","Reading Corps","Groves","Math Corps","MobyMax","Online adaptive practice","Skill-specific practice","Progress monitoring","Family communication"];
function drawMoverPlans(){

    const s=SECTION.students.find(x=>x.id===m.sid); if(!s)return"";
    const r=s[m.subject];
    return `<div class="mover"><div class="hd">
        <div><b>${esc(fullName(s))}</b> <span class="faint small">· ${esc(gradeLabel(s.grade))}</span></div>

      <div class="chips" style="margin-top:8px">
        ${(SUBJ==="both"||MODE==="review")?`
        <button class="chip ${m.subject==='reading'?'sel':''}" data-msub="${m.sid}:reading">Reading</button>
        <button class="chip ${m.subject==='math'?'sel':''}" data-msub="${m.sid}:math">Math</button>`:`<span class="pill">${esc(m.subject)}</span>`}

      <div class="grid g4" style="margin-top:10px">

          <select data-mf="${m.sid}:winterBand">${bandOpts(m.winterBand)}</select></div>
        <div><label class="fld" style="margin-top:0">Winter pct</label>
          <input type="number" data-mf="${m.sid}:winterPct" value="${esc(m.winterPct)}"></div>
        <div><label class="fld" style="margin-top:0">Spring band</label>
          <select data-mf="${m.sid}:springBand">${bandOpts(m.springBand)}</select></div>
        <div><label class="fld" style="margin-top:0">Spring pct</label>
          <input type="number" data-mf="${m.sid}:springPct" value="${esc(m.springPct)}"></div>
      </div>
      <label class="fld">What will you do for this student?</label>
      <div class="chips">${MOVER_ACTIONS.map(a=>`<button class="chip ${(m.plan||[]).includes(a)?'sel':''}" data-mact="${m.sid}::${esc(a)}">${esc(a)}</button>`).join("")}</div>
      <input type="text" data-mf="${m.sid}:notes" placeholder="Notes" value="${esc(m.notes)}" style="margin-top:6px">
    </div>`;
  }).join("");
  box.querySelectorAll("[data-unmove]").forEach(b=>b.onclick=()=>toggleMover(b.dataset.unmove));
  box.querySelectorAll("[data-msub]").forEach(b=>b.onclick=()=>{const[id,v]=b.dataset.msub.split(":");const m=PLAN.movers.find(x=>x.sid===id);m.subject=v;save();drawMoverPlans();});
  box.querySelectorAll("[data-mf]").forEach(inp=>inp.oninput=()=>{const[id,k]=inp.dataset.mf.split(":");const m=PLAN.movers.find(x=>x.sid===id);m[k]=inp.value;save();});
  box.querySelectorAll("[data-mact]").forEach(b=>b.onclick=()=>{const[id,a]=b.dataset.mact.split("::");const m=PLAN.movers.find(x=>x.sid===id);m.plan=m.plan||[];const i=m.plan.indexOf(a);if(i>=0)m.plan.splice(i,1);else m.plan.push(a);save();b.classList.toggle("sel");});
}
function bandOpts(v){ return `<option value="">—</option>`+CONFIG.bands.map(b=>`<option value="${b.key}" ${v===b.key?"selected":""}>${b.label}</option>`).join(""); }

/* --- Stage 9: Build the plan (summary) --- */
function namesFor(pred){ return SECTION.students.filter(pred).map(shortName); }

    ${(()=>{ const subs=MODE==="review"?["reading","math"]:subjectsToShow();
      const cells=subs.map(w=>{const st=w==="reading"?rs:ms;const l=w==="reading"?"Reading":"Math";

      return `<div class="card"><h3>${MODE==="review"?"My students’ reading &amp; math (context)":"My class at a glance"}</h3>
        <div class="grid ${subs.length>1?'g4':'g2'}">${cells}</div>
        <p class="small muted" style="margin-top:10px">School goals — achievement ${CONFIG.goals.achievement}th · growth ${CONFIG.goals.growth}th.</p></div>`; })()}

    ${MODE==="review"?`
      <div class="card"><h3>My goals for ${esc(SUBJECTS)}</h3>
        <p style="white-space:pre-wrap;margin:0"><b>Goal:</b> ${esc((g.content&&g.content.goal)||"—")}</p>
        <p style="white-space:pre-wrap;margin:.5rem 0 0"><b>Actions:</b> ${esc((g.content&&g.content.actions)||"—")}</p>
        <p style="white-space:pre-wrap;margin:.5rem 0 0"><b>Evidence it’s working:</b> ${esc((g.content&&g.content.evidence)||"—")}</p></div>
      <div class="notice">Reading Corps, Math Corps, and Groves for these students are managed by their reading and math
        teacher — they’re not part of your content-area review.</div>`
    :`
    <div class="${subjectsToShow().length>1?'grid g2':''}">
      ${subjectsToShow().map(w=>goalSummaryCard(w==="reading"?"Reading":"Math", g[w], w==="reading"?rs:ms)).join("")}
    </div>

    <div class="card"><h3>Intervention recommendations <span class="faint small">(for review — not placements)</span></h3>
      <div class="grid g2">

    <div class="card"><h3>Students I’m personally committing to move</h3>

      ${PLAN.watch.length?`<ul>${PLAN.watch.map(w=>`<li>${esc(w.reason)}</li>`).join("")}</ul>`:""}

function goalSummaryCard(label,g,st){ g=g||{};
  return `<div class="card"><h3>My ${label} goals</h3>
    <p class="small"><b>Fall baseline:</b> ${st.medianPct??"—"}th &nbsp; <b>Winter:</b> ${esc(g.winterPct||"—")}th &nbsp; <b>Spring:</b> ${esc(g.springPct||CONFIG.goals.achievement)}th</p>

}
function recCol(title,names){
  return `<div><div class="small" style="font-weight:600;margin-bottom:6px">${esc(title)} <span class="faint">(${names.length})</span></div>

}

      <div class="quote">${uniq.map(esc).join(" · ")}</div></div>`:

      questions, direct limited resources, and check whether what you’re doing is working.</p>`}
    <div class="card">
      <label class="fld" style="margin-top:0">What is one commitment you’re leaving Data Review Day with?</label>
      <textarea rows="3" id="f_commit" placeholder="My one commitment…">${esc(PLAN.commitment||"")}</textarea>
    </div>
    <div class="card" style="border-left:3px solid #b45309">
      <h3 style="margin:0 0 2px">Tell us what would help</h3>
      <p class="muted small" style="margin:0 0 10px">This goes to the leadership team. Be honest — it’s how we make the work better and get you what you need.</p>
      <label class="fld" style="margin-top:0">What could we do better to support you in this work?</label>
      <textarea rows="3" id="f_feedback" placeholder="What got in the way today, what was unclear, what would make this more useful…">${esc(PLAN.reflections.feedback||"")}</textarea>

function genReport(mode){ const sel=$("#rep_student"); const id=sel&&sel.value;

function openSection(id,role){ SECTION=BULTUM.sections.find(s=>s.id===id); ROLE=role||"core";

  showJourneyChrome(); renderRail(); renderTopbar(); renderStage(); window.scrollTo(0,0); }

my \u00b7 Every Student Data Review \u00b7 consolidated summary<\/div>\n<script>\nconst DATA = {\"classes\": [{\"id\": \"KG A\", \"grade\": \"K\", \"teacher\": \"Agatha Pietzak\", \"band\": \"K-3\", \"rAch\": 46, \"mAch\": 49, \"rGro\": null, \"mGro\": null, \"rc\": [\"Shuaib Mohamed\", \"Zulekha Osman\", \"Dahira Sharif\"], \"groves\": [], \"mc\": [\"Shuaib Mohamed\", \"Mahir Momin\", \"Niya Muktar\", \"Zulekha Osman\"], \"mon\": [], \"movers\": 3, \"promise\": \"Fostering a love for learning\", \"numbers\": \"My class is just learning how to learn. I see effort, curiosity, and stamina, plus big feelings and new routines that get in the way of showing what they know.\", \"live\": \"I'll celebrate brave tries and mistakes, not just right answers, with a daily moment to share something we tried or wondered.\", \"every\": \"It's on us to change our teaching, not wait for the student to catch up. I'll offer more time, a different way in, and extra support, while keeping learning joyful so \\\"not yet\\\" never becomes \\\"I can't.\\\"\", \"fastbridge\": \"Most of my students had strong concepts of print and word sounds. The most struggle was with letter-sound and letter names.\", \"monitor\": \"A quiet student who's below target.\", \"reflection\": \"My students will experience a classroom where they're the ones doing the thinking, trying, and talking. Learning will feel like something they get to do.\", \"commitment\": \"I will start interactive writing this week and use it as a daily moment where students share something they tried.\", \"doBetter\": \"I was confused in the student-selection part and how to accurately project their percentile throughout the year. I asked another teacher and they were also confused.\", \"support\": \"Time, coaching, and materials.\", \"pdf\": \"data:application/pdf;base64,JVBERi0xLjMKJbrfrOAKMyAwIG9iago8PC9UeXBlIC9QYWdlCi9QYXJlbnQgMSAwIFIKL1Jlc291cmNlcyAyIDAgUgovTWVkaWFCb3ggWzAgMCA2MTIuIDc5Mi5dCi9Db250ZW50cyA0IDAgUgo+PgplbmRvYmoKNCAwIG
