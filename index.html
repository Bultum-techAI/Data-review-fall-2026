ading program for 4\u20138.<\/p><\/div>\n  <div class=\"note\"><b>Flags:<\/b> Grade 3 Tier-3 Groves demand (8) is double capacity (4) \u2014 review across 3A/3B by need. 4B recommended 6 for a 4-spot Groves class. Math Corps K\u20133 is at capacity (${a.mcK3}/${cap.mathK3}).<\/div>`;\n  $(\"#p-interventions\").innerHTML=h;\n})();\n\n/* ---------- BY CLASS ---------- */\n(function(){\n  let h=`<h2 class=\"sec\">Every class at a glance<\/h2>\n  <p class=\"sub2\">Median achievement &amp; growth percentiles. Goal: achievement 46th \u00b7 growth 60th.<\/p>\n  <div class=\"controls\"><label>Filter: <select id=\"bandsel\">\n     <option value=\"all\">All groups<\/option><option value=\"K-3\">K\u20133<\/option><option value=\"4-8\">4\u20138<\/option><\/select><\/label>\n     <span class=\"legend\"><span class=\"sw\" style=\"background:#8a1f1f\"><\/span>&lt;21 <span class=\"sw\" style=\"background:#c0521a\"><\/span>21\u201340 <span class=\"sw\" style=\"background:#b58900\"><\/span>41\u201360 <span class=\"sw\" style=\"background:#2f8f4e\"><\/span>61\u201380 <span class=\"sw\" style=\"background:#2563c9\"><\/span>&gt;80<\/span><\/div>\n  <div class=\"card\" style=\"overflow:auto\"><table><thead><tr>\n    <th>Class<\/th><th>Teacher<\/th><th>Read ach<\/th><th>Math ach<\/th><th>Read growth<\/th><th>Math growth<\/th><th>Named<\/th><\/tr><\/thead>\n    <tbody id=\"classrows\"><\/tbody><\/table><\/div>`;\n  $(\"#p-classes\").innerHTML=h;\n  const cell=p=>p==null?'<span style=\"color:#9aa6a0\">\u2014<\/span>':`<span class=\"pill\" style=\"color:#fff;background:${bandColor(p)};border-color:${bandColor(p)}\">${p}<\/span>`;\n  function draw(){const b=$(\"#bandsel\").value;\n    $(\"#classrows\").innerHTML=DATA.classes.filter(c=>b==='all'||c.band===b).map(c=>`<tr>\n      <td><b>${esc(c.id)}<\/b>${c.review?' <span class=\"chip\">review<\/span>':''}<\/td><td>${esc(c.teacher)}<\/td>\n      <td>${cell(c.rAch)}<\/td><td>${cell(c.mAch)}<\/td><td>${cell(c.rGro)}<\/td><td>${cell(c.mGro)}<\/td>\n      <td>${c.movers||'\u2014'}<\/td><\/tr>`).join(\"\");}\n  $(\"#bandsel\").onchange=draw; draw();\n})();\n\n/* ---------- COMMENTS ---------- */\n(function(){\n  let h=`<h2 class=\"sec\">Comments &amp; feedback to review<\/h2>\n  <p class=\"sub2\">Every teacher's mission reflection, who they're watching, and their feedback to leadership. Click a card to expand.<\/p>\n  <div class=\"controls\">\n    <input type=\"search\" id=\"csearch\" placeholder=\"Search names, text\u2026\" style=\"flex:1;min-width:180px\">\n    <select id=\"cfilter\"><option value=\"all\">All submissions<\/option><option value=\"fb\">Only those with feedback<\/option><\/select>\n  <\/div><div id=\"cmts\"><\/div>`;\n  $(\"#p-comments\").innerHTML=h;\n  function field(k,v){return v&&v!=='-'&&v!=='(not stated)'?`<div class=\"fld\"><div class=\"k\">${k}<\/div><div class=\"v\">${esc(v)}<\/div><\/div>`:'';}\n  function card(c){\n    const fb=(c.doBetter&&c.doBetter!=='Nothing.'&&c.doBetter!=='None.'&&c.doBetter!=='Nothing'&&c.doBetter!=='nothing at this time')||c.support;\n    return `<details class=\"cmt\"><summary><span><span class=\"who\">${esc(c.teacher)}<\/span> <span class=\"role\">\u00b7 ${esc(c.id)}${c.review?' \u00b7 review':''}<\/span><\/span>\n       ${fb?'<span class=\"pill at\">has feedback<\/span>':'<span class=\"pill ok\">no asks<\/span>'}<\/summary>\n      <div class=\"body\">\n        ${field('Promise carried in',c.promise)}\n        ${field(\"What the numbers don't show\",c.numbers)}\n        ${field(\"How I'll live it\",c.live)}\n        ${field('On \"every student\"',c.every)}\n        ${field('FastBridge (K\u20133)',c.fastbridge)}\n        ${field('Monitoring closely',c.monitor)}\n        ${field('Reflection',c.reflection)}\n        ${field('One commitment',c.commitment)}\n        <div class=\"fld\"><div class=\"k\">Feedback to leadership<\/div>\n          <div class=\"fb-do\"><b>Do better:<\/b> ${esc(c.doBetter||'\u2014')}<br><b>Support needed:<\/b> ${esc(c.support||'\u2014')}<\/div><\/div>\n      <\/div><\/details>`;\n  }\n  function draw(){const q=$(\"#csearch\").value.toLowerCase(),f=$(\"#cfilter\").value;\n    let list=DATA.classes;\n    if(f==='fb')list=list.filter(c=>(c.doBetter&&!/^(nothing|none)/i.test(c.doBetter))||(c.support&&c.support!=='Time.'));\n    if(q)list=list.filter(c=>JSON.stringify(c).toLowerCase().includes(q));\n    $(\"#cmts\").innerHTML=list.map(card).join(\"\")||'<p class=\"sub2\">No matches.<\/p>';}\n  $(\"#csearch\").oninput=draw; $(\"#cfilter\").onchange=draw; draw();\n})();\n\n/* ---------- ORIGINAL PLANS ---------- */\n(function(){\n  const withPdf=DATA.classes.filter(c=>c.pdf);\n  let h=`<h2 class=\"sec\">Original submitted plans<\/h2>\n  <p class=\"sub2\">Every teacher's original Data Review PDF, exactly as they submitted it. Click to open in a new tab or download.<\/p>\n  <div class=\"card\" style=\"overflow:auto\"><table><thead><tr><th>Teacher<\/th><th>Class / role<\/th><th>Original plan<\/th><\/tr><\/thead><tbody>\n    ${withPdf.map(c=>`<tr><td><b>${esc(c.teacher)}<\/b><\/td><td>${esc(c.id)}${c.review?' \u00b7 review':''}<\/td>\n       <td><a href=\"${c.pdf}\" target=\"_blank\" rel=\"noopener\" download=\"${esc(c.pdfname||('Bultum_'+c.id+'.pdf'))}\" style=\"color:var(--green);font-weight:700;text-decoration:none\">Open PDF &#8599;<\/a><\/td><\/tr>`).join(\"\")}\n  <\/tbody><\/table><\/div>\n  <div class=\"note\"><b>No original on file \u2014 not yet submitted:<\/b> ${DATA.outstanding.map(o=>esc(o.teacher)+' ('+esc(o.role)+')').join('; ')}.<\/div>`;\n  $(\"#p-originals\").innerHTML=h;\n})();\n\n/* ---------- OUTSTANDING ---------- */\n(function(){const o=DATA.outstanding,n=o.reduce((s,x)=>s+x.n,0);\n  $(\"#p-outstanding\").innerHTML=`<h2 class=\"sec\">Not yet submitted<\/h2>\n    <p class=\"sub2\">${n} plans outstanding across ${o.length} staff.<\/p>\n    <div class=\"card\" style=\"overflow:auto\"><table><thead><tr><th>Teacher<\/th><th>Role / classes<\/th><th>Plans<\/th><\/tr><\/thead>\n    <tbody>${o.map(x=>`<tr class=\"miss\"><td><b>${esc(x.teacher)}<\/b><\/td><td>${esc(x.role)}<\/td><td>${x.n}<\/td><\/tr>`).join(\"\")}\n    <tr style=\"font-weight:700;background:#eef4f0\"><td>Total<\/td><td><\/td><td>${n}<\/td><\/tr><\/tbody><\/table><\/div>\n    <div class=\"note\">The optional specialist reviews from Ahmed Ismail (ELL) and Sahra Tobe (SPED) were also not in this batch \u2014 flag only if you're tracking them.<\/div>`;\n})();\n\n/* ---------- helpers ---------- */\nfunction kpi(n,l,cls){return `<div class=\"card kpi ${cls||''}\"><div class=\"n\">${n}<\/div><div class=\"l\">${l}<\/div><\/div>`;}\nfunction barChart(rows,max){return rows.map(([lab,val,col])=>`<div class=\"bar-row\">\n    <div class=\"bar-lab\">${lab}<\/div><div class=\"bar-wrap\"><div class=\"bar\" style=\"width:${Math.max(3,val/max*100)}%;background:${col}\">${val}<\/div><\/div><\/div>`).join(\"\");}\nfunction achChart(key,label){const cs=DATA.classes.filter(c=>c[key]!=null);\n  return `<div class=\"legend\" style=\"margin-bottom:6px\">${label} \u2014 median percentile<\/div>`+cs.map(c=>`<div class=\"bar-row\">\n    <div class=\"bar-lab\">${esc(c.id)}<\/div><div class=\"bar-wrap\">\n      <div class=\"bar\" style=\"width:${Math.max(3,c[key])}%;background:${bandColor(c[key])}\">${c[key]}<\/div>\n      <div class=\"goal-line\" style=\"left:46%\"><\/div><\/div><\/div>`).join(\"\")+`<div class=\"legend\">Black line = 46th-percentile school goal.<\/div>`;}\nfunction capBar(rec,cap,tag){const pct=cap?Math.min(100,rec/cap*100):0,over=rec>cap;\n  return `<div class=\"bar-row\"><div class=\"bar-lab\">${tag||'Recommended'}<\/div>\n    <div class=\"bar-wrap\"><div class=\"bar\" style=\"width:${Math.max(3,rec/(Math.max(cap,rec))*100)}%;background:${over?'#8a1f1f':'#2f8f4e'}\">${rec}<\/div><\/div>\n    <span class=\"pill ${over?'over':'ok'}\">${rec} / ${cap}${over?` \u00b7 over ${rec-cap}`:''}<\/span><\/div>`;}\n<\/script>\n<\/body>\n<\/html>\n";

function allPlans(){ return BULTUM.sections.map(s=>({sec:s,plan:LS.get(planKey(s.id),null)})); }
function recIn(plan,pred){ if(!plan||!plan.students)return 0; return Object.values(plan.students).filter(pred).length; }
// Which role's plan holds a given subject's interventions in a section
function roleForSubject(sec,subject){ const ts=sec.teachers||[];
  const t=ts.find(x=>x.subject===subject)||ts.find(x=>x.subject==="both")||ts.find(x=>x.id==="core");
  return t?t.id:"core"; }
function subjectPlan(sec,subject){ return LS.get(planKey(sec.id,roleForSubject(sec,subject)),null); }
function anyPlanFinished(sec){ return (sec.teachers||[]).some(t=>{const p=LS.get(planKey(sec.id,t.id),null);return p&&p.done&&p.done.includes("finish");}); }

function abarColor(p){ return p==null?'#9aa6a0':p>80?'#2563c9':p>=61?'#3E8E5A':p>=41?'#d9a400':p>=21?'#e07b1a':'#8a1f1f'; }
function aBar(label,pct){ const c=abarColor(pct);
  return `<div style="display:flex;align-items:center;gap:10px;margin:6px 0">
    <div style="width:120px;text-align:right;font-size:.82rem;flex:none">${esc(label)}</div>
    <div style="flex:1;background:#eef2ef;border-radius:6px;height:20px;position:relative;overflow:hidden">
      <div style="height:100%;width:${pct==null?0:Math.max(3,pct)}%;background:${c};border-radius:6px;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;color:#fff;font-size:.72rem;font-weight:700">${pct==null?'':pct}</div>
      <div style="position:absolute;top:-2px;bottom:-2px;left:${CONFIG.goals.achievement}%;width:2px;background:#111;opacity:.5"></div></div></div>`; }
function secCounts(sec){ const r=subjectPlan(sec,"reading"), m=subjectPlan(sec,"math");
  return {rc:recIn(r,p=>p.readingTier==="t2"), gr:recIn(r,p=>p.readingTier==="t3"),
    mc:recIn(m,p=>p.mathTier==="t2"), mon:recIn(r,p=>p.monitor),
    movers:(sec.teachers||[]).reduce((a,t)=>{const p=LS.get(planKey(sec.id,t.id),null);return a+(p&&p.movers?p.movers.length:0);},0)}; }
function planStatus(sec,t){ const p=LS.get(planKey(sec.id,t.id),null);
  return !p||!p.done||!p.done.length?"none":p.done.includes("finish")?"done":"prog"; }

function adminStatus(){
  const done=[],prog=[],todo=[];
  BULTUM.sections.forEach(sec=>(sec.teachers||[]).forEach(t=>{
    const s=planStatus(sec,t), label=`${sec.className} — ${t.name}${t.mode==="review"?" (review)":""}`;
    (s==="done"?done:s==="prog"?prog:todo).push(label);
  }));
  const list=arr=>arr.length?`<div class="chips" style="margin-top:6px">${arr.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div>`:'<div class="faint small">None.</div>';
  $("#adminBody").innerHTML=`
    <div class="grid g3"><div class="card"><h3 style="color:#3E8E5A">Complete (${done.length})</h3>${list(done)}</div>
      <div class="card"><h3 style="color:#b45309">In progress (${prog.length})</h3>${list(prog)}</div>
      <div class="card"><h3 style="color:#8a1f1f">Not started (${todo.length})</h3>${list(todo)}</div></div>
    <div class="card" style="margin-top:14px"><h3>Students with very low data not yet recommended for intervention</h3>${lowNoInterventionList()}</div>`;
}

function schoolStat(l,n){ return `<div class="stat"><div class="n">${n}</div><div class="l">${esc(l)}</div></div>`; }
function fastbridgeSummary(){
  const rows=[]; let risk=0,some=0,ok=0,any=false;
  realSections().filter(s=>["K","1","2","3"].includes(s.grade)).forEach(sec=>{
    const withFb=sec.students.filter(s=>s.fastbridge&&s.fastbridge.risk);
    const p=LS.get(planKey(sec.id,"core"),null); const obs=(p&&p.fastbridge&&p.fastbridge.observe)||"";
    if(!withFb.length && !obs) return; any=true;
    const nr=withFb.filter(s=>s.fastbridge.risk==="high").length, ns=withFb.filter(s=>s.fastbridge.risk==="some").length, no=withFb.filter(s=>s.fastbridge.risk==="low").length;
    risk+=nr; some+=ns; ok+=no;
    rows.push(`<tr><td><b>${esc(sec.className)}</b></td><td>${nr||"—"}</td><td>${ns||"—"}</td><td>${no||"—"}</td>
      <td class="small">${esc(obs)}</td></tr>`);
  });
  if(!any) return "";
  return `<div class="card"><h3>FastBridge (K–3) — Fall screening</h3>
    <div class="grid g3" style="margin:10px 0">
      ${schoolStat("At risk",risk)}${schoolStat("Some risk",some)}${schoolStat("On grade level",ok)}</div>
    <div style="overflow:auto"><table><thead><tr><th>Class</th><th>At risk</th><th>Some risk</th><th>On level</th><th>Teacher observation</th></tr></thead>
      <tbody>${rows.join("")}</tbody></table></div>
    <p class="small faint" style="margin-top:6px">Counts are from the FastBridge Fall screening file, matched by student ID.</p></div>`;
}
function feedbackList(){
  const items=[];
  realSections().forEach(sec=>(sec.teachers||[]).forEach(t=>{
    const p=LS.get(planKey(sec.id,t.id),null); if(!p||!p.reflections) return;
    const fb=p.reflections.feedback, su=p.reflections.support;
    if(fb||su) items.push({who:`${t.name} · ${sec.className}`,fb,su});
  }));
  if(!items.length) return "";
  return `<div class="card"><h3>Teacher feedback &amp; support requests</h3>
    <p class="small faint" style="margin:0 0 8px">What staff told us would help them do this work better.</p>
    ${items.map(i=>`<div style="border-left:3px solid #b45309;padding-left:10px;margin:10px 0">
      <div class="small" style="font-weight:600">${esc(i.who)}</div>
      ${i.fb?`<div class="small"><span class="faint">Do better:</span> ${esc(i.fb)}</div>`:""}
      ${i.su?`<div class="small"><span class="faint">Support needed:</span> ${esc(i.su)}</div>`:""}

function lowNoInterventionList(){
  const cut=CONFIG.bands[0].max, out=[];
  realSections().forEach(sec=>{
    const rPlan=subjectPlan(sec,"reading"), mPlan=subjectPlan(sec,"math");
    sec.students.forEach(s=>{
      ["reading","math"].forEach(w=>{ const r=s[w]; if(r&&r.pct!=null&&r.pct<=cut){
        const plan=w==="reading"?rPlan:mPlan;
        const p=plan&&plan.students&&plan.students[s.id];
        const covered = w==="reading" ? (p&&(p.readingTier==="t2"||p.readingTier==="t3")) : (p&&p.mathTier==="t2");
        const mon = p&&p.monitor;
        if(!covered&&!mon) out.push(`${fullName(s)} (${sec.className}, ${w} ${r.pct}th)`);
      }});
    });
  });
  if(!out.length) return '<p class="muted" style="margin:0">None — every student in the lowest band has a recommendation or is being monitored.</p>';
  return `<div class="notice">${out.length} student-subjects in the lowest band have no recommendation and aren’t being monitored:</div>
    <div class="chips">${out.slice(0,60).map(x=>`<span class="tag mon">${esc(x)}</span>`).join("")}</div>`;
}
function capacityBody(){
  const cap=CONFIG.capacities, perGrade=cap.grovesK3PerGrade||4, perClass48=cap.grovesG48PerClass||4;
  let k3=0,g48=0,read=0; const grovesK3={K:0,"1":0,"2":0,"3":0}; const groves48=[];
  realSections().forEach(sec=>{
    const rPlan=subjectPlan(sec,"reading"), mPlan=subjectPlan(sec,"math");
    read+=recIn(rPlan,p=>p.readingTier==="t2");
    const t3=recIn(rPlan,p=>p.readingTier==="t3");
    if(["K","1","2","3"].includes(sec.grade)) grovesK3[sec.grade]+=t3; else groves48.push({name:sec.className,rec:t3});
    const mc=recIn(mPlan,p=>p.mathTier==="t2");
    if(sec.band==="K3")k3+=mc; else g48+=mc;
  });
  const gradeRows=["K","1","2","3"].map(g=>{const rec=grovesK3[g], over=rec>perGrade;
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)">
      <span>Grade ${g}</span><span class="pill ${over?'warn':'ok'}">${rec} recommended · ${perGrade} spots${over?` · over by ${rec-perGrade}`:""}</span></div>`;}).join("");
  const k3Total=Object.values(grovesK3).reduce((a,b)=>a+b,0);
  const classRows48=groves48.map(x=>{const over=x.rec>perClass48;
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)">
      <span>${esc(x.name)}</span><span class="pill ${over?'warn':'ok'}">${x.rec} recommended · ${perClass48} spots${over?` · over by ${x.rec-perClass48}`:""}</span></div>`;}).join("");
  const g48Total=groves48.reduce((a,b)=>a+b.rec,0);
  return `
    <div class="notice" style="background:#fff6e6;border-color:#e8c97a;color:#6b4a00">
      <b>These are our capacities right now.</b> They can change — and there’s usually a little wiggle room depending on scheduling. Use this to guide conversations, not as a hard cutoff.</div>
    <p class="muted">Recommendations are never auto-removed when they exceed capacity. Where demand is higher than supply, review candidates across classrooms by need.</p>
    ${capRow("Math Corps · K–3",k3,cap.k3Math)}
    ${capRow("Math Corps · 4–8",g48,cap.g48Math)}
    ${capRow("Reading Corps · K–3",read,cap.reading)}
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline">
        <h3 style="margin:0">Groves · Tier 3 (K–3)</h3>
        <span class="pill ${k3Total>perGrade*4?'warn':'ok'}">${k3Total} recommended · ${perGrade} per grade (${perGrade*4} total)</span></div>
      <div style="margin-top:8px">${gradeRows}</div>
      <p class="small faint" style="margin-top:8px">Groves Tier 3 capacity is <b>${perGrade} per grade</b> for K–3. Each grade’s two classes share those ${perGrade} spots.</p></div>
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline">
        <h3 style="margin:0">Groves · Tier 2 (4–8)</h3>
        <span class="pill ${groves48.some(x=>x.rec>perClass48)?'warn':'ok'}">${g48Total} recommended · ${perClass48} per class</span></div>
      <div style="margin-top:8px">${classRows48||'<span class="faint small">No 4–8 classes.</span>'}</div>
      <p class="small faint" style="margin-top:8px">Groves Tier 2 capacity for grades 4–8 is <b>${perClass48} spots per class</b>. There is no Tier 3 reading program for 4–8 at this time.</p></div>`;
}
function capRow(label,rec,avail){
  const over = avail!=null && rec>avail;
  const pct = avail? Math.min(100,rec/avail*100):0;
  return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline">
      <h3 style="margin:0">${esc(label)}</h3>
      <span class="pill ${over?'warn':'ok'}">${rec} recommended · ${avail??"capacity not set"} available</span></div>
    <div class="meter ${over?'over':''}" style="margin-bottom:0"><div class="bar"><i style="width:${pct}%"></i></div></div>
    ${over?`<div class="notice">Schoolwide recommendations exceed capacity by <b>${rec-avail}</b>. Administrative review required.</div>`:""}</div>`;
}

  c.capacities={k3Math:+$("#set_k3").value||0,g48Math:+$("#set_g48").value||0,reading:+$("#set_read").value||0,

function parseCSV(text){
  const rows=[];let i=0,f="",row=[],q=false;
  while(i<text.length){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else{ if(c==='"')q=true; else if(c===','){row.push(f);f="";} else if(c==='\n'){row.push(f);rows.push(row);row=[];f="";}
      else if(c==='\r'){} else f+=c; }
    i++; }
  if(f.length||row.length){row.push(f);rows.push(row);}
  return rows;
}
function handleImport(e){
  const files=[...e.target.files]; let merged=0,secs=new Set();
  let pending=files.length;
  files.forEach(file=>{ const rd=new FileReader();
    rd.onload=()=>{ try{
      const rows=parseCSV(rd.result); const H={}; rows[0].forEach((h,i)=>H[h.trim()]=i);
      const need=["ClassName","Teacher","Subject","StudentID","EndRIT","EndPercentile","ConditionalGrowthPercentile"];
      if(!need.every(n=>n in H)){ appendImp(`⚠ ${file.name}: not an NWEA ASG Summary export (missing columns).`); }
      else{ mergeRows(rows.slice(1),H,secs); merged++; appendImp(`✓ ${file.name}: merged.`); }
    }catch(err){ appendImp(`⚠ ${file.name}: ${err.message}`); }
      if(--pending===0 && merged){ attachTeachers(); appendImp(`Done. Updated ${secs.size} class section(s). Reloading picker…`);
        setTimeout(()=>{VIEW="picker";renderPicker();},900); }
    };
    rd.readAsText(file);
  });
}
function appendImp(m){ const o=$("#imp_out"); if(o)o.innerHTML+=esc(m)+"<br>"; }
function mergeRows(rows,H,secs){
  const num=v=>{v=(v||"").trim();if(!v)return null;const n=+v;return isNaN(n)?null:n;};
  const byClass={};
  rows.forEach(r=>{ if(!r[H.ClassName])return; const cn=r[H.ClassName].trim(); secs.add(cn);
    const sid=(r[H.StudentID]||"").trim(); const subj=(r[H.Subject]||"").trim();
    const end=num(r[H.EndRIT]); if(end==null)return;
    const rec={rit:end,pct:num(r[H.EndPercentile]),growth:num(r[H.ConditionalGrowthPercentile]),
      startRit:num(r[H.StartRIT]),startPct:num(r[H.StartPercentile]),
      met:(r[H["MetGrowthProjection?"]]||"").replace(/\*/g,"").trim()||null,
      quad:(r[H.EndGrowthandAchievement]||"").trim()||null};
    const g=(r[H.StudentGrade]||"").trim();
    const c=byClass[cn]||(byClass[cn]={teacher:(r[H.Teacher]||"").trim(),students:{}});
    const st=c.students[sid]||(c.students[sid]={id:sid,first:(r[H.StudentFirstName]||"").trim(),
      last:(r[H.StudentLastName]||"").trim(),mi:"",grade:(g&&g!=="***")?g:null,reading:null,math:null,science:null});
    if(g&&g!=="***")st.grade=g;
    if(subj==="Mathematics")st.math=rec; else if(subj==="Language Arts")st.reading=rec; else if(subj==="Science")st.science=rec;
  });
  Object.entries(byClass).forEach(([cn,c])=>{
    const gf=cn.toUpperCase().startsWith("KG")?"K":(cn.match(/\d/)||["?"])[0];
    const GN={K:0}; "12345678".split("").forEach((d)=>GN[d]=+d);
    const studs=Object.values(c.students).filter(s=>s.reading||s.math||s.science);
    studs.forEach(s=>{if(!s.grade)s.grade=gf;});
    studs.sort((a,b)=>(a.last+a.first).localeCompare(b.last+b.first));
    const id=cn.replace(/ /g,"_");
    const sec={id,className:cn,grade:gf,gradeNum:GN[gf]??99,band:(GN[gf]??99)<=3?"K3":"G48",teacher:c.teacher,email:"",students:studs};
    const idx=BULTUM.sections.findIndex(x=>x.id===id);
    if(idx>=0)BULTUM.sections[idx]=sec; else BULTUM.sections.push(sec);
  });
  BULTUM.sections.sort((a,b)=>(a.gradeNum-b.gradeNum)||a.className.localeCompare(b.className));
}

function blocksToText(B){ return B.map(b=> b.t==="sp"?"" : b.t==="title"?pdfSafe(b.s).toUpperCase() : b.t==="meta"?pdfSafe(b.s) : b.t==="h2"?("\n"+pdfSafe(b.s).toUpperCase()) : b.t==="li"?(" - "+pdfSafe(b.s)) : pdfSafe(b.s) ).join("\n"); }
async function pdfFromBlocks(B, fname){
  let lib=null; try{ lib=await loadJsPDF(); }catch(e){ lib=null; }
  if(!lib||!lib.jsPDF){ dl(fname+".txt", blocksToText(B)); return; }
  const doc=new lib.jsPDF({unit:"pt",format:"letter"});
  const PW=doc.internal.pageSize.getWidth(), PH=doc.internal.pageSize.getHeight();
  const M=54, CW=PW-2*M; let y=0, page=1;
  const GREEN=[30,91,62], INK=[38,43,40], MUT=[120,126,120], LINE=[214,224,216];
  function header(){ doc.setFillColor(GREEN[0],GREEN[1],GREEN[2]); doc.rect(0,0,PW,72,"F");
    doc.setTextColor(255,255,255); doc.setFont("helvetica","bold"); doc.setFontSize(16); doc.text(pdfSafe(B[0].s), M, 34);
    doc.setFont("helvetica","normal"); doc.setFontSize(10.5); doc.setTextColor(222,236,228); doc.text(pdfSafe(B[1].s), M, 54); y=100; }
  function footer(){ doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(MUT[0],MUT[1],MUT[2]);
    doc.text(pdfSafe(`Bultum Academy \u00B7 Every Student Data Review \u00B7 generated ${new Date().toLocaleDateString()}`), M, PH-28);
    doc.text(String(page), PW-M, PH-28, {align:"right"}); }
  function brk(h){ if(y+h>PH-46){ footer(); doc.addPage(); page++; header(); } }
  header();
  for(let i=2;i<B.length;i++){ const b=B[i];
    if(b.t==="sp"){ y+=8; continue; }
    if(b.t==="h2"){ brk(30); y+=6; doc.setFont("helvetica","bold"); doc.setFontSize(12.5); doc.setTextColor(GREEN[0],GREEN[1],GREEN[2]);
      doc.text(pdfSafe(b.s), M, y); y+=7; doc.setDrawColor(LINE[0],LINE[1],LINE[2]); doc.line(M,y,M+CW,y); y+=15; continue; }
    doc.setFont("helvetica","normal"); doc.setFontSize(10.5); doc.setTextColor(INK[0],INK[1],INK[2]);
    if(b.t==="li"){ const lines=doc.splitTextToSize(pdfSafe(b.s), CW-20);
      lines.forEach((ln,idx)=>{ brk(15); if(idx===0){ doc.setFillColor(GREEN[0],GREEN[1],GREEN[2]); doc.circle(M+3, y-3.5, 1.6, "F"); } doc.text(ln, M+16, y); y+=15; }); y+=3;
    } else { const lines=doc.splitTextToSize(pdfSafe(b.s), CW);
      lines.forEach(ln=>{ brk(15); doc.text(ln, M, y); y+=15; }); y+=4; }
  }
  footer(); doc.save(fname+".pdf");
}

function closeModal(){ $("#modalRoot").innerHTML=""; }
window.prev=prev;window.next=next;window.commitPlan=commitPlan;window.exportTeacher=exportTeacher;
window.exportRoster=exportRoster;window.saveSettings=saveSettings;window.saveTeachers=saveTeachers;
window.toggleKG=toggleKG;window.closeModal=closeModal;window.go=go;

function applyOverridesAndAttach(){
  // apply saved core-teacher/email overrides, attach roles, then apply per-role name overrides
  const ov=LS.get("bdr:sectionsOverride",null);
  if(ov)ov.forEach(o=>{const s=BULTUM.sections.find(x=>x.id===o.id);if(s){if(o.teacher)s.teacher=o.teacher;if(o.email!=null)s.email=o.email;}});
  attachTeachers();
  buildReviewers();
  if(ov)ov.forEach(o=>{const s=BULTUM.sections.find(x=>x.id===o.id);if(!s)return;
    if(o.roles)o.roles.forEach(r=>{const t=(s.teachers||[]).find(x=>x.id===r.id);if(t&&r.name)t.name=r.name;});
    else if(o.content){const t=(s.teachers||[]).find(x=>x.id==="content");if(t)t.name=o.content;}
  });
}
async function boot(){
  applyBandColors();
  applyOverridesAndAttach();        // app is usable immediately, before any network
  if(isAuthed()){ VIEW="picker"; renderPicker(); } else { renderLogin(); }
  missionInit();                    // read-only mission board, in the background
  if(fbEnabled()){                  // live cloud sync connects in the background, then refreshes
    try{
      await fbInit();
      if(fbReady){ await fbHydrate(); applyOverridesAndAttach(); if(VIEW==="picker") renderPicker(); fbListen(); }
    }catch(e){ /* stays local */ }
  }
}
boot();
</script>
